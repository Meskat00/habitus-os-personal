      take("habits",a=>{S.habits=a.map(h=>({id:h.id||uid(),name:h.name||h.title||"Habit",icon:h.icon||"◎",history:h.history||h.days||{}}));});

      take("conceptNotes",a=>{S.notes=a;});take("notes",a=>{S.notes=a;});
      take("focusSessions",a=>{S.focusSessions=a;});take("timelineBlocks",a=>{S.timelineBlocks=a;});
      take("journalEntries",a=>{S.journalEntries=a;});take("weeklyReviews",a=>{S.weeklyReviews=a;});
      take("goals",a=>{S.goals=a;});take("books",a=>{S.books=a;});
      if(typeof d.identity==="string"&&d.identity){S.identity=d.identity;touched=true;}
      if(Array.isArray(d.roles)&&d.roles.length){S.roles=d.roles;touched=true;}
      if(Array.isArray(d.focusAreas)&&d.focusAreas.length){S.focusAreas=d.focusAreas;touched=true;}
      const w=d.scoreWeights||d.weights;
      if(w&&typeof w==="object"){S.scoreWeights=Object.assign(S.scoreWeights,w);touched=true;}
      ["deepWorkTarget","studyTarget","waterTarget","preferredStudy"].forEach(k=>{if(d[k]!==undefined){S[k]=d[k];touched=true;}});
      if(d.theme&&typeof d.theme==="object"){
        const th=d.theme;

        if(th.accent)S.theme.accent=th.accent;

    }catch(e){/* try next key */}
  }
  return null;
}

   and routed to trash on delete. Keeps one canonical record per entity. */
const Repos={
  all(kind){return S[kind]||[];},
  byId(kind,id){return id?(S[kind]||[]).find(x=>x&&x.id===id)||null:null;},
  add(kind,obj,label){
    const rec=meta51(Object.assign({id:uid(),createdAt:Date.now(),updatedAt:Date.now()},obj||{}));
    commit(label||("add-"+kind),()=>{if(!Array.isArray(S[kind]))S[kind]=[];S[kind].push(rec);});
    return rec;
  },
  update(kind,id,patch,label){
    const x=this.byId(kind,id);if(!x)return null;
    commit(label||("upd-"+kind),()=>{Object.assign(x,patch||{},{updatedAt:Date.now()});});
    return x;
  },
  /* delete → trash (Archive/Unlink offered by callers where dependents exist) */
  remove(kind,id,label){
    const arr=S[kind]||[];const i=arr.findIndex(x=>x&&x.id===id);if(i<0)return false;
    const[item]=arr.splice(i,1);
    commit(label||("del-"+kind),()=>{S.trash.push({tid:uid(),kind,item,deletedAt:Date.now()});});
    return true;
  },
  /* referential-integrity check for one record's link fields */
  brokenRefs(kind,x,links){
    const out=[];
    for(const[f,tk]of links){const id=x[f];if(id&&!this.byId(tk,id))out.push({field:f,kind:tk,id});}

/* Daily Alignment = weighted mean of four sub-scores. A component with no
   applicable data is EXCLUDED (shown as "No data"), never scored 0%. */
function alignmentScore(date){
  const dk=dayKey(date),w=S.scoreWeights;
  const comps=[];
  if(S.tasks.length){
    const dueT=S.tasks.filter(x=>!x.done&&(x.due===dk||!x.due)).length;
    const doneT=S.tasks.filter(x=>x.done&&x.doneDate===dk).length;
    const pool=dueT+doneT;
    if(pool)comps.push({key:"execution",label:"Execution",value:doneT/pool,weight:w.execution??30,
      formula:"tasks done today ÷ (due or done today)"});
  }
  comps.push({key:"focus",label:"Focus",value:Math.min(1,focusMinOn(dk)/Math.max(1,S.deepWorkTarget)),weight:w.focus??30,
    formula:"deep-work minutes ÷ daily target"});
  {
    const pool=[...S.topics,...S.problems].filter(x=>(x.nextReview||"")<=dk||x.lastReviewed===dk);
    if(pool.length){
      const done=pool.filter(x=>x.lastReviewed===dk).length;
      comps.push({key:"learning",label:"Learning",value:done/pool.length,weight:w.learning??20,
        formula:"reviews completed ÷ reviews due at start of day"});
    }
  }
  {
    const wb=[];
    if(S.habits.length)wb.push(habitsDoneOn(date)/S.habits.length);
    wb.push(journalOn(dk)?1:0);
    wb.push(Math.min(1,(S.water[dk]||0)/Math.max(1,S.waterTarget)));
    const vals=wb.filter(v=>v!=null);
    if(vals.length)comps.push({key:"wellbeing",label:"Wellbeing",value:vals.reduce((a,b)=>a+b,0)/vals.length,weight:w.wellbeing??20,
      formula:"mean of habits done, journal entry, water vs target"});
  }

}

function actualBarHTML(b,i){

function mustWinTask(){
  const open=S.tasks.filter(x=>!x.done);
  return open.find(x=>x.mustWin)||open.filter(x=>x.due&&x.due<=dayKey()).sort((a,b)=>(a.due||"").localeCompare(b.due||""))[0]||null;
}
function nextActionInfo(){
  const t=dayKey(),nowMin=new Date().getHours()*60+new Date().getMinutes();
  const mw=mustWinTask();
  if(mw)return{label:mw.title,detail:"Must-win task"+(mw.due?` · due ${fmtD(mw.due)}`:""),taskId:mw.id};
  const upcoming=S.timelineBlocks.filter(b=>b.date===t&&!b.done&&b.start+b.dur>nowMin).sort((a,b)=>a.start-b.start)[0];
  if(upcoming)return{label:upcoming.title,detail:`Scheduled ${minFmt(upcoming.start)} · ${upcoming.dur} min`,blockId:upcoming.id};
  const top=S.tasks.filter(x=>!x.done).sort((a,b)=>({high:0,med:1,low:2}[a.priority]-{high:0,med:1,low:2}[b.priority]))[0];
  if(top)return{label:top.title,detail:"Top open task",taskId:top.id};
  return{label:"Nothing queued",detail:"Add a task or plan a block — or take a real break."};
}
function todayBlocksSorted(d){return S.timelineBlocks.filter(b=>b.date===(d||dayKey())).sort((a,b)=>a.start-b.start);}
function todayPlanActualHTML(){
  const t=dayKey();
  const blocks=todayBlocksSorted(t);
  if(!blocks.length)return emptyHTML("▦","Nothing planned today. Open the Planner and give the day a shape.");
  return blocks.map(b=>{
    const hasA=b.actualStart!=null&&b.actualEnd!=null;
    const sv=hasA?b.actualStart-b.start:0, dv=hasA?(b.actualEnd-b.actualStart)-b.dur:0;
    const maxEnd=Math.max(b.start+b.dur,hasA?b.actualEnd:b.start+b.dur);
    const span=Math.max(1,maxEnd-b.start);
    const actW=hasA?Math.max(4,(b.actualEnd-b.actualStart)/span*100):0;
    const actL=hasA?Math.max(0,(b.actualStart-b.start)/span*100):0;
    return `<div class="pa-row"><div class="t"><b>${esc(b.title)}</b>
      <small class="mono">${minFmt(b.start)} → ${minFmt(b.start+b.dur)} · planned ${b.dur}m${hasA?` · actual ${minFmt(b.actualStart)} → ${minFmt(b.actualEnd)} (${b.actualEnd-b.actualStart}m)`:""}</small>
      <div class="pa-tracks" aria-hidden="true"><div class="pa-plan" style="width:100%"></div>
      ${hasA?`<div class="pa-actual" style="left:${actL}%;width:${actW}%"></div>`:""}</div></div>
      <div>${b.done?`<span class="pill low">${esc(b.execState||"completed")}</span>`:hasA?`<span class="pill info">in progress</span>`:`<span class="pill neutral">planned</span>`}
      ${hasA&&(sv||dv)?`<span class="pill ${sv>0?"high":"low"}">${sv>0?"+":""}${sv}m start</span><span class="pill ${dv>0?"high":"low"}">${dv>0?"+":""}${dv}m duration</span>`:""}</div></div>`;
  }).join("");
}
function capacityHTML(){

  return `<div class="kv"><span class="k">Scheduled</span><span class="mono">${scheduled} min</span></div>

}

    if(pb&&FOCUS)pb.style.width=Math.min(100,100*(1-fcFocusLeft(now)/FOCUS.total))+"%";
  },_lastStr:null};
  const first=fcCountdownString(Date.now());fc.build(first);fcFocusInst._lastStr=first;
  FC.add(fcFocusInst);
}

function domainMinutes(days){

function todayTasksHTML(){const t=dayKey();return S.tasks.filter(x=>x.due===t).map(taskRow).join("")||emptyHTML("☕","No tasks due today.");}
async function sha256(str){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
const b64e=arr=>btoa(String.fromCharCode(...arr));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function encryptBackup(pass,plaintext){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:120000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(plaintext));
  return{app:"habitus-os",encrypted:true,exportedAt:new Date().toISOString(),salt:b64e(salt),iv:b64e(iv),data:b64e(new Uint8Array(ct))};
}
async function decryptBackup(pass,doc){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(doc.salt),iterations:120000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(doc.iv)},key,b64d(doc.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

  openModal("Export backup","Download a portable backup of your workspace.",

    `<label class="f" style="display:flex;gap:.5rem;align-items:center;margin-top:.6rem"><input type="checkbox" name="enc" style="width:18px;height:18px"/> Encrypt with passphrase (AES-256-GCM)</label>`+
    `<div id="mExpPassWrap" style="display:none"><label class="f" for="mExpPass">Passphrase</label><input class="input" id="mExpPass" name="pass" type="password" style="margin-top:.32rem" placeholder="Choose a strong passphrase" autocomplete="new-password"/></div>`+
    `<p class="sub" style="margin-top:.6rem">Backups include a checksum and record counts so imports can be verified. Store a copy outside this browser.</p>
     <div style="margin-top:.6rem"><button class="btn btn-ghost btn-sm" data-action="q-export-portable">⤓ Quantum workspace only (portable JSON)</button></div>`,
    v=>{exportData(v.fname,v.enc,v.pass);},"Download ⤓","💾");
  $("#mExpName").closest("form").querySelector('[name="enc"]').addEventListener("change",e=>{
    $("#mExpPassWrap").style.display=e.target.checked?"block":"none";
  });
}
async function exportData(name,encrypt,pass){
  try{
    const{kinds,prefs}=DB.splitState(JSON.parse(JSON.stringify(S)));
    const counts={};for(const k of DB_KINDS)counts[k]=(kinds[k]||[]).length;
    const body={app:"habitus-os",v:3,exportedAt:new Date().toISOString(),kinds,prefs,counts};
    body.checksum=await sha256(JSON.stringify({kinds:body.kinds,prefs:body.prefs}));
    let out=body,ext="json";
    if(encrypt){
      if(!pass||pass.length<4){toast("Passphrase too short");return;}
      out=await encryptBackup(pass,JSON.stringify(body));ext="enc.json";
    }
    const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=(name||("habitus-os-backup-"+dayKey()))+"."+ext;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    commit("backup",()=>{S.lastExternalBackup=Date.now();});
    toast(encrypt?"Encrypted backup downloaded ⤓":"Backup downloaded ⤓");
  }catch(err){toast("Export failed: "+err.message);}
}

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.fcchk!==undefined){const k=t.dataset.fcchk;commit("fc-chk",()=>{S.clock[k]=!!t.checked;});return;}
  if(t.id==="fcEndTime"&&t.value){
    const [eh,em]=String(t.value).split(":").map(Number);
    if(Number.isFinite(eh)&&Number.isFinite(em)){
      const end=new Date();end.setHours(eh,em,0,0);
      let diff=Math.round((end.getTime()-Date.now())/1000);
      if(diff<=0)diff+=86400;
      commit("fc-endtime",()=>{S.clock.focusSecs=diff;});
      fcSyncCustom(diff);
      toast(`Counting down to ${t.value}`);
    }
    return;
  }
});

  const t=e.target;
  if(t.dataset&&t.dataset.fcvol!==undefined){const v=Math.max(0,Math.min(100,+t.value||0));commit("fc-vol",()=>{S.clock.volume=v/100;});const o=document.getElementById("fcVolOut");if(o)o.textContent=v+"%";return;}
  if(t.dataset&&t.dataset.fcnum!==undefined){const k=t.dataset.fcnum;commit("fc-num",()=>{S.clock[k]=Math.max(0,+t.value||0);});return;}

  if(t.dataset&&t.dataset.fccol!==undefined){const k=t.dataset.fccol;commit("fc-col",()=>{S.clock[k]=t.value;});return;}
  if(t.id==="noteSearch"){noteQuery=t.value;filterNotes();return;}
  if(t.id==="fcWcSearch"){fcWcRender(t.value);return;}

  if(t.dataset&&t.dataset.qset){const k=t.dataset.qset;

/* Timeline drag: transform-based, clamped, commit-on-release */
document.addEventListener("pointerdown",e=>{
  if(route!=="planner")return;
  const blk=e.target.closest(".tl-block");
  if(!blk||e.target.closest("button"))return;
  const b=byId(S.timelineBlocks,blk.dataset.bl);if(!b)return;
  e.preventDefault();
  const startY=e.clientY,origTop=b.start/60*HOUR_H;
  const maxTop=Math.max(0,(24*60-b.dur)/60*HOUR_H);
  blk.style.transition="none";blk.style.zIndex="9";
  let curTop=origTop;
  const move=ev=>{curTop=clamp(0,maxTop,origTop+(ev.clientY-startY));blk.style.transform=`translateY(${curTop-origTop}px)`;};
  const up=()=>{
    blk.removeEventListener("pointermove",move);
    blk.removeEventListener("pointerup",up);
    blk.removeEventListener("pointercancel",up);
    blk.style.transition="";blk.style.zIndex="";blk.style.transform="";
    const snapped=clamp(0,24*60-b.dur,Math.round((curTop/(HOUR_H/60))/15)*15);
    if(snapped!==b.start){commit("block-move",()=>{b.start=snapped;});Regions.plannerBlocks();Regions.exec();toast(`Moved to ${minFmt(snapped)}`);}
  };
  blk.addEventListener("pointermove",move);
  blk.addEventListener("pointerup",up);
  blk.addEventListener("pointercancel",up);
  try{blk.setPointerCapture(e.pointerId);}catch(err){}
});

/* ================================================================
   LAYER 12 — Focus timer (timestamp-based, drift-proof)
================================================================ */
let FOCUS=null;
function fmtClock(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function startFocusSession(type,subject,minutes,link){
  if(FOCUS&&FOCUS.timer)clearInterval(FOCUS.timer);
  const total=Math.max(1,Math.round(minutes*60)); /* keep seconds precision from custom countdown */
  FOCUS={id:uid(),type,subject,total,left:total,distractions:0,paused:false,pausedTotal:0,pauseStart:0,
    endsAt:Date.now()+total*1000,startedAt:Date.now(),link:link||null,timer:null,
    status:"running",plannedMin:Math.max(1,Math.round(minutes)),adjustments:[]};
  TE.kick();
  persistFocusSoon();
  try{document.documentElement.classList.add("focusing");}catch(e){}
  a11yAnnounce(`Focus session started. ${subject}. ${Math.round(minutes)} minutes.`);
  try{if(window.Cloud&&Cloud.enabled)Cloud.claimTimer({kind:"focus",label:subject,totalSeconds:total});}catch(e){}
  viewFocus();
}
function tickFocus(){
  const f=FOCUS;if(!f)return;
  document.title=(f.overtime?"+":"")+fmtClock(Math.max(0,f.left))+" · Focusing — Habitus OS";
  persistFocusSoon();
}
/* Canonical session classification: focus analytics count only genuine focus work.
   A linked block/task references the ONE session record — never a copied time value. */
const NON_FOCUS_SESSION_TYPES=["Stopwatch","Calculation","Practice","Actual"];
const isFocusSession=s=>s&&!NON_FOCUS_SESSION_TYPES.includes(s.type);
/* Timer lifecycle: planned → running → paused → completed | completed-with-overtime
   | ended-early | cancelled | interrupted | recovered. Cancelled ≠ ended-early. */
function buildSessionRecord(f,{status,finished}){
  const now=Date.now();
  const plannedMin=f.plannedMin||Math.max(1,Math.round(f.total/60));
  const pauseSecs=Math.round(((f.pausedTotal||0)+(f.paused?now-(f.pauseStart||now):0))/1000);
  const otSecs=f.overtime?Math.max(0,Math.round((now-(f.overtimeStart||now))/1000)):0;
  const wallSecs=Math.max(0,Math.round((now-(f.startedAt||now))/1000));
  const focusedSecs=Math.max(0,wallSecs-pauseSecs);
  return{
    id:f.id||uid(),date:dayKey(),type:f.type,subject:f.subject,
    originalPlannedSeconds:plannedMin*60,
    adjustedTotalSeconds:Math.round(f.total),
    actualWallSeconds:wallSecs,
    actualFocusedSeconds:focusedSecs,
    pausedSeconds:pauseSecs,
    overtimeSeconds:otSecs,
    minutes:finished?Math.max(1,Math.round(f.total/60)):Math.max(1,Math.round(focusedSecs/60)),
    distractions:f.distractions||0,quality:4,
    taskId:null,projectId:((f.link||{}).projectId)||null,blockId:null,
    linkedQuantumTopicId:((f.link||{}).quantumTopicId)||null,
    linkedQuantumProjectId:((f.link||{}).quantumProjectId)||null,
    outcome:"",difficulty:3,energy:3,note:"",
    startedAt:f.startedAt||null,endedAt:now,
    status,
    plannedStart:f.startedAt||null,
    plannedEnd:(f.startedAt||now)+plannedMin*60000,
    plannedDuration:plannedMin*60,          /* original plan — never mutated by ± adjustments */
    actualStart:f.startedAt||null,actualEnd:now,
    actualFocusedDuration:focusedSecs,      /* wall time minus pauses */
    adjustedDuration:Math.round(f.total),   /* plan ± adjustments */
    pauseDuration:pauseSecs,overtimeDuration:otSecs,
    adjustments:(f.adjustments||[]).slice(),
    /* legacy compat */
    completed:status==="completed"||status==="completed-with-overtime",
    plannedMin,overtimeMin:Math.round(otSecs/60),pausedMin:Math.round(pauseSecs/60)
  };
}
function endFocusSession(finished){
  const f=FOCUS;if(!f)return;clearInterval(f.timer);FOCUS=null;
  try{if(window.Cloud&&Cloud.enabled)Cloud.releaseTimer();}catch(e){}
  try{document.documentElement.classList.remove("focusing");}catch(e){}
  if(fcFocusInst){FC.remove(fcFocusInst);fcFocusInst=null;}
  if(DB.available)DB.putMeta("focus",null).catch(()=>{});
  document.title="Habitus OS — Research Command Center";
  if(finished&&!f.overtime){
    FC_Audio.focusDone(S.clock.volume);
    notifyUser("Focus session complete",`${f.subject||"Session"} is complete.`,"habitus-focus-complete");
    a11yAnnounce("Focus session complete.");
  }
  TE.persistSoon();
  const status=finished?(f.overtime?"completed-with-overtime":"completed"):"ended-early";
  const rec=buildSessionRecord(f,{status,finished});
  const mins=rec.minutes;
  const lk=f.link||{};
  const dayBlocks=S.timelineBlocks.filter(bl=>bl.date===dayKey()).sort((a,b)=>a.start-b.start);
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  const sug=lk.blockId||(dayBlocks.find(bl=>nowM>=bl.start-30&&nowM<=bl.start+bl.dur+30)||{}).id||"";
  const openTasks=S.tasks.filter(t=>!t.done);
  openModal("Session complete",`${f.type} · ${f.subject} — ${mins} min · ${f.distractions} distraction(s) logged`,
    `<div class="field-row">
      <div><label class="f" for="mSBlock">Linked plan block</label><select class="input" id="mSBlock" name="blockId" style="margin-top:.32rem"><option value="">—</option>${dayBlocks.map(bl=>`<option value="${bl.id}"${sug===bl.id?" selected":""}>${minFmt(bl.start)} · ${esc(bl.title)}</option>`).join("")}</select></div>
      <div><label class="f" for="mSTask">Linked task</label><select class="input" id="mSTask" name="taskId" style="margin-top:.32rem"><option value="">—</option>${openTasks.map(t=>`<option value="${t.id}"${lk.taskId===t.id?" selected":""}>${esc(t.title)}</option>`).join("")}</select></div>
    </div>`+
    field("Outcome","outcome","","What came out of this session?")+
    `<div class="field-row">
      <div><label class="f" for="mDiff">Difficulty (1–5)</label><select class="input" id="mDiff" name="difficulty" style="margin-top:.32rem">${[1,2,3,4,5].map(i=>`<option${i===3?" selected":""}>${i}</option>`).join("")}</select></div>
      <div><label class="f" for="mEnergy">Energy (1–5)</label><select class="input" id="mEnergy" name="energy" style="margin-top:.32rem">${[1,2,3,4,5].map(i=>`<option${i===3?" selected":""}>${i}</option>`).join("")}</select></div>
    </div>`+
    `<label class="f" id="qLabel">Session quality (1–5)</label><div class="mood-row" id="qRow" role="group" aria-labelledby="qLabel">${[1,2,3,4,5].map(i=>`<button type="button" class="mood-btn ${i===4?"sel":""}" data-q="${i}" aria-pressed="${i===4}" aria-label="Quality ${i} of 5">${["😞","😐","🙂","😄","🤩"][i-1]}</button>`).join("")}</div><input type="hidden" name="quality" id="qVal" value="4"/>`+
    `<label class="f" for="mNote">Session note</label><textarea class="input" id="mNote" name="note" rows="2" style="margin-top:.32rem" placeholder="Key insight, blocker, next step…"></textarea>`,
    v=>{
      const task=byId(S.tasks,v.taskId)||null;
      const projId=task&&task.projectId?task.projectId:(lk.projectId||null);
      const sess={...rec,
        taskId:v.taskId||null,projectId:projId,blockId:v.blockId||null,
        _noSync:!!(window.Cloud&&Cloud.supersededTimer),
        quality:+v.quality||4,outcome:String(v.outcome||"").trim(),
        difficulty:+v.difficulty||3,energy:+v.energy||3,note:String(v.note||"").trim()};
      commit("end-session",()=>{
        S.focusSessions.push(sess);
        if(sess.blockId){const b=byId(S.timelineBlocks,sess.blockId);
          if(b){b.sessionIds=b.sessionIds||[];if(!b.sessionIds.includes(sess.id))b.sessionIds.push(sess.id);
            /* Actual execution record from the session timestamps */
            if(b.actualStart==null&&sess.startedAt&&sess.endedAt){
              const d=new Date(sess.startedAt);
              b.actualStart=d.getHours()*60+d.getMinutes();
              b.actualEnd=b.actualStart+Math.max(1,Math.round((sess.endedAt-sess.startedAt)/60000));
              if(!b.done){b.done=true;b.status="done";b.execState="completed";}
            }}}
      });
      if(S.clock.breakAfter&&!FC_BREAK.active){
        const todayCount=S.focusSessions.filter(s=>s.date===dayKey()&&isFocusSession(s)).length;
        fcStartBreak(todayCount>0&&todayCount%S.clock.sessionsBeforeLong===0);
      }
      Regions.sessions();Regions.exec();Regions.dashToday();Regions.dashStats();Regions.dashScore();updateMiniScore();toast("Session logged ✓");},
    "Save session","◉");
  const qr=$("#qRow");
  if(qr)qr.addEventListener("click",e=>{const b=e.target.closest("[data-q]");if(!b)return;
    $$("#qRow .mood-btn").forEach(x=>{const on=x===b;x.classList.toggle("sel",on);x.setAttribute("aria-pressed",String(on));});
    const qv=$("#qVal");if(qv)qv.value=b.dataset.q;});
}

    /* entity search: tasks, goals, projects, notes, papers, resources, quantum */

      <div class="cmdk-list" id="cmdkList" role="listbox"></div></div></div>`;
    const inp=$("#cmdkIn"),list=$("#cmdkList");this.sel=0;
    const paint=()=>{
      const items=this.items(inp.value);
      list.innerHTML=items.slice(0,9).map((c,i)=>`<div class="cmdk-item ${i===this.sel?"sel":""}" role="option" aria-selected="${i===this.sel}" data-ci="${this.cmds.indexOf(c)}"><span class="ci" aria-hidden="true">${c.i}</span><span>${esc(c.t)}</span><small>${esc(c.s)}</small></div>`).join("")||`<div class="empty">No matches.</div>`;

        el.onclick=()=>{this.close();this.cmds[+el.dataset.ci].run();};

      });
    };
    inp.oninput=()=>{this.sel=0;paint();};
    inp.onkeydown=e=>{
      const items=this.items(inp.value).slice(0,9);
      if(e.key==="ArrowDown"){e.preventDefault();this.sel=Math.min(items.length-1,this.sel+1);paint();}
      else if(e.key==="ArrowUp"){e.preventDefault();this.sel=Math.max(0,this.sel-1);paint();}
      else if(e.key==="Enter"){const c=items[this.sel];if(c){this.close();c.run();}}
      else if(e.key==="Escape")this.close();
    };

  },

let TR_RECOVERY=[];

async function recoverTimers(){
  if(!DB.available)return;
  const now=Date.now();
  let foc,sw,brk,pres,fs;
  try{
    [foc,sw,brk,pres,fs]=await Promise.all([
      DB.getMeta("focus").catch(()=>null),DB.getMeta("timer.sw").catch(()=>null),
      DB.getMeta("timer.break").catch(()=>null),DB.getMeta("timer.pres").catch(()=>null),
      DB.getMeta("timer.fs").catch(()=>null)]);
  }catch(e){return;}
  TR_RECOVERY=[];
  if(foc&&foc.total){
    let left=foc.left;
    if(!foc.paused)left=Math.max(0,foc.left-(now-foc.savedAt)/1000);
    if(left>=30)TR_RECOVERY.push({kind:"focus",rec:{...foc,left}});
    else DB.putMeta("focus",null).catch(()=>{});
  }
  if(sw&&(sw.running||(sw.elapsed||0)>5000))TR_RECOVERY.push({kind:"sw",rec:sw});
  if(brk&&brk.endsAt>now-30*60000)TR_RECOVERY.push({kind:"brk",rec:brk});
  if(pres&&(pres.running||(pres.elapsed||0)>5000)&&!pres.finished)TR_RECOVERY.push({kind:"pres",rec:pres});
  if(fs)TR_RECOVERY.push({kind:"fs",rec:fs});
  if(TR_RECOVERY.length)trRender();
}

      st=Object.assign({},loaded.prefs||{});

    if(DB.available){
      await DB.saveAll(S).catch(e=>Diag.log("migration","post-migration save failed",e.message));
      const back=await DB.loadAll().catch(()=>null);
      const vres=verifyMigration51(back,mig.report);
      if(!vres.ok)migrationRecoveryOffer(mig.snapId,vres.problems);
      else setTimeout(()=>toast(`Upgraded to Pro 5.1 ✓ — ${mig.report.moved} records, snapshot kept`),900);
    }else{Persist.soon();}
  }
  try{const h=await DB.getMeta("health");if(h)Object.assign(Health,h);}catch(e){}
  applyTheme();applyMotion();
  if(window.Cloud&&Cloud.enabled&&window.__fbApi){
    try{await Cloud.afterLocalBoot();}catch(e){Diag.log("cloud","afterLocalBoot",e.message);}
  }

  refreshHealth().then(()=>{fillDataCards();});
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().then(p=>{Health.persisted=p;}).catch(()=>{});}
  if(!S.onboarded)setTimeout(()=>Onboarding.start(),450);
  else setTimeout(()=>recoverTimers(),600);
  backupAgeCheck();
}

function planFromTasksModal(){

function varianceInsightsHTML(){
  const done=S.timelineBlocks.filter(b=>b.date>=dayKey(addDays(new Date(),-30))&&b.done&&b.actualStart!=null&&b.actualEnd!=null);
  if(!done.length)return `<p class="sub">Complete blocks with actual times to see variance insights.</p>`;
  const svs=done.map(b=>b.actualStart-b.start);
  const avgSv=Math.round(svs.reduce((a,x)=>a+x,0)/svs.length);
  const devs=done.map(b=>Math.abs((b.actualEnd-b.actualStart)-b.dur)/b.dur);
  const avgErr=Math.round(100*devs.reduce((a,x)=>a+x,0)/devs.length);
  const reasons={};done.forEach(b=>{if(b.varianceReason)reasons[b.varianceReason]=(reasons[b.varianceReason]||0)+1;});
  const topR=Object.entries(reasons).sort((a,b)=>b[1]-a[1])[0];
  const wkSess=S.focusSessions.filter(s=>s.date>=dayKey(addDays(new Date(),-7)));
  const wkMin=wkSess.reduce((a,s)=>a+(+s.minutes||0),0);
  const unlinked=wkSess.filter(s=>!s.blockId).reduce((a,s)=>a+(+s.minutes||0),0);
  const unplanned=wkMin?Math.round(100*unlinked/wkMin):0;
  return `<div class="kv"><span class="k">Blocks measured</span><span class="mono">${done.length}</span></div>
  <div class="kv"><span class="k">Avg start variance</span><span class="mono" style="color:${avgSv>10?"var(--bad)":"var(--good)"}">${fmtVar(avgSv)}</span></div>
  <div class="kv"><span class="k">Avg estimation error</span><span class="mono">${avgErr}%</span></div>
  <div class="kv"><span class="k">Top variance reason</span><span>${topR?esc(topR[0])+" ("+topR[1]+")":"—"}</span></div>
  <div class="kv"><span class="k">Unplanned work share · 7d</span><span class="mono">${unplanned}%</span></div>
  <p class="hint">Positive start variance = starting late. Estimation error = |actual − planned| ÷ planned duration.</p>`;
}
function paintGrouped(cv,labels,pa,aa){
  const[c,W,H]=setupCanvas(cv,170);
  const nums=[...pa,...aa].filter(v=>v!=null);
  if(!nums.length){c.fillStyle=cssVar("--faint")||"#888";c.font="13px Inter";c.textAlign="center";c.fillText("No data yet.",W/2,H/2);return;}
  const max=Math.max(...nums,1),n=labels.length,gap=10,gw=(W-gap*(n-1))/n,bw=Math.max(6,Math.min(24,(gw-8)/2));
  const cx=(gw-bw*2-4)/2;
  pa.forEach((v,i)=>{
    const x=i*(gw+gap)+cx;
    const draw=(val,color)=>{if(val==null)return;const bh=Math.max(3,(H-30)*val/max),y=H-20-bh;
      c.fillStyle=color;c.beginPath();if(c.roundRect)c.roundRect(x+(color===paC?0:bw+4),y,bw,bh,3);else c.rect(x,y,bw,bh);c.fill();};
    const paC=cssVar("--accent")||"#8b5cf6",aaC=cssVar("--accent2")||"#22d3ee";
    draw(v,paC);draw(aa[i],aaC);
    c.fillStyle=cssVar("--faint")||"#888";c.font="9px Inter";c.textAlign="center";c.fillText(labels[i],i*(gw+gap)+gw/2,H-5);
  });
  c.font="10px Inter";c.textAlign="left";
  c.fillStyle=cssVar("--accent")||"#8b5cf6";c.fillText("■ planned",8,12);
  c.fillStyle=cssVar("--accent2")||"#22d3ee";c.fillText("■ actual",80,12);
}
Charts.register("planactual",cv=>{
  const labels=[],pa=[],aa=[];

  }
  paintGrouped(cv,labels,pa,aa);
});

function scheduleNext(it,q){
  it.reviewCount=(it.reviewCount||0)+1;

/* ---------- review flow ---------- */
function reviewModal(entry){
  const kind=entry.kind,it=entry.it,isT=kind==="topics";
  const body=isT
    ?`<h3 class="font-display" style="margin-bottom:.4rem">${esc(it.name)}</h3><p class="ob-sub2">${esc(it.notes||"No notes on this topic yet.")}</p><div class="kv"><span class="k">Mastery</span><span class="mono">${it.mastery||0}%</span></div><div class="kv"><span class="k">Stage</span><span>${esc(it.stage||"learning")}</span></div>${(it.formulas||[]).length?`<div class="hint" style="margin:.4rem 0">Formula cards</div>`+(it.formulas||[]).map(f=>`<div class="mono" style="background:var(--surface2);border-radius:8px;padding:.5rem .7rem;margin-bottom:.35rem;font-size:.9rem">${esc(f)}</div>`).join(""):""}`
    :`<h3 class="font-display" style="margin-bottom:.4rem">Problem recall</h3><p style="line-height:1.6">${esc(it.statement||"")}</p>
     <div class="kv"><span class="k">Source</span><span>${esc(it.source||"—")}</span></div>
     <div class="kv"><span class="k">Error type</span><span>${esc(it.errorCat||"—")}</span></div>
     <p class="hint">Try to recall the lesson before rating.</p>`;
  openModal("Review",isT?"How well do you know this?":"How solid is the fix?",
    body+`<div class="mood-row" id="rqRow" role="group" aria-label="Recall quality">${[1,2,3,4,5].map(q=>`<button type="button" class="mood-btn" data-q="${q}" aria-label="Quality ${q} of 5">${q}</button>`).join("")}</div>
    <p class="hint">1 = forgot · 3 = shaky · 5 = perfect recall</p>`,
    null,"","★");
  const hidem=$("#modalRoot .modal-foot .btn-primary");if(hidem)hidem.style.display="none";
  const row=$("#rqRow");
  if(row)row.addEventListener("click",e=>{
    const b=e.target.closest("[data-q]");if(!b)return;
    const q=+b.dataset.q;
    commit("review",()=>{
      const o=byId(S[kind],it.id);if(!o)return;
      scheduleNext(o,q);
      if(isT){o.mastery=clamp(0,100,(o.mastery||0)+(q>=4?6:q===3?2:q===2?-4:-8));
        if(o.mastery>=85&&o.reviewCount>=3)o.stage="mastered";else if(o.mastery>=55)o.stage="practicing";else o.stage="review";}
      else{if(!Array.isArray(o.attempts))o.attempts=[];o.attempts.push({date:dayKey(),quality:q});
        if(q>=4&&o.reviewCount>=2)o.status="reviewed";}
    });
    Modal.close();
    Regions.learnQueue();Regions.topics();Regions.problems();
    const nq=reviewQueue();
    if(nq.length){toast(`Rated ${q}/5 · ${nq.length} more due`);setTimeout(()=>reviewModal(nq[0]),350);}
    else toast("All caught up 🎉");
  });
}
/* ---------- GRE drill ---------- */
let DRILL=null;
function greDrillModal(){
  const pool=S.problems.filter(p=>/gre/i.test(p.subject||"")&&p.status!=="mastered");
  const list=(pool.length?pool:S.problems.filter(p=>p.status!=="mastered"));
  if(!list.length){toast("No problems to drill — log some first");return;}
  openModal("GRE drill","Mixed-topic flashcard drill.",
    `<label class="checkline"><input type="checkbox" name="timed" style="width:18px;height:18px"/> Timed mode · 90 seconds per card</label>`,
    v=>{DRILL={list:[...list].sort(()=>Math.random()-0.5).slice(0,10),i:0,show:false,timed:!!v.timed,deadline:0,timer:null};drillPaint();},
    "Start drill","🎯");
}
function drillTick(){
  const d=DRILL;if(!d||!d.timed)return;
  const left=Math.max(0,Math.ceil((d.deadline-Date.now())/1000));
  const el=$("#drillTimer");if(el)el.textContent=left+"s";
  if(left<=0){d.show=true;drillPaint();}
}
function drillPaint(){
  const d=DRILL;if(!d)return;
  if(d.i>=d.list.length){if(d.timer)clearInterval(d.timer);Modal.close();DRILL=null;Regions.problems();Regions.learnQueue();toast("Drill complete 🎯");return;}
  const p=d.list[d.i];
  if(d.timed&&!d.show){d.deadline=Date.now()+90000;if(d.timer)clearInterval(d.timer);d.timer=setInterval(drillTick,500);}
  else if(d.timer){clearInterval(d.timer);d.timer=null;}
  openModal(`Drill · ${d.i+1} of ${d.list.length}`,(d.timed?`<span class="mono" id="drillTimer" aria-label="Time left">90s</span> · `:"")+esc(p.source||"Problem"),
    `<p style="font-size:1.05rem;line-height:1.65">${esc(p.statement||"")}</p>`+
    (d.show
      ?`<div class="kv"><span class="k">Lesson</span><span>${esc(p.lesson||"—")}</span></div>
        <div class="kv"><span class="k">Error type</span><span>${esc(p.errorCat||"—")}</span></div>
        <div class="mood-row" id="dqRow" role="group" aria-label="Recall quality">${[1,2,3,4,5].map(q=>`<button type="button" class="mood-btn" data-dq="${q}" aria-label="Quality ${q}">${q}</button>`).join("")}</div>
        <p class="hint">Rate your recall 1–5</p>`
      :`<button type="button" class="btn btn-primary" id="drillShow" style="margin-top:.6rem">Show answer</button>`),
    null,"","🎯");
  const hided=$("#modalRoot .modal-foot .btn-primary");if(hided)hided.style.display="none";
  const sh=$("#drillShow");
  if(sh)sh.onclick=()=>{d.show=true;drillPaint();};
  const mr=$("#dqRow");
  if(mr)mr.addEventListener("click",e=>{
    const b=e.target.closest("[data-dq]");if(!b)return;
    const q=+b.dataset.dq;
    commit("drill",()=>{const o=byId(S.problems,p.id);if(o){scheduleNext(o,q);if(q>=4&&o.reviewCount>=2)o.status="reviewed";}});
    d.i++;d.show=false;drillPaint();
  });
}
</script>
<script>

const MS_STAGES=["idea","outline","draft","revision","submitted","published"];

let convProject=null,runFilter="all",paperFilter="all";
/* ---------- convergence matrix ---------- */
function convMatrixHTML(){
  const pid=convProject||(S.projects[0]||{}).id||null;
  const runs=S.calcRuns.filter(r=>!pid||r.projectId===pid);
  const cuts=[...new Set(runs.map(r=>+r.cutoff).filter(v=>v>0))].sort((a,b)=>a-b);
  const kgs=[...new Set(runs.map(r=>r.kgrid).filter(Boolean))].sort();
  if(!cuts.length||!kgs.length)return emptyHTML("🧪","No convergence data yet — log runs with cutoff + k-grid.");
  const cell=(c,k)=>runs.filter(r=>+r.cutoff===c&&r.kgrid===k).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))[0];
  return `<div class="table-wrap"><table class="matrix" aria-label="Convergence matrix"><thead><tr><th>cutoff ↓ · k-grid →</th>${kgs.map(k=>`<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>
  ${cuts.map(c=>`<tr><th>${c} eV</th>${kgs.map(k=>{const r=cell(c,k);
    return `<td class="${r?(r.status==="converged"?"ok":r.status==="failed"?"bad":"run"):""}">${r
      ?`<b class="mono">${r.energy??"—"}</b><small>${esc(r.status)}${r.energy!=null?" eV":""}</small>`
      :`<span style="color:var(--faint)">·</span>`}</td>`;}).join("")}</tr>`).join("")}
  </tbody></table></div><p class="hint">Green = converged · latest run shown per cell · energy in eV.</p>`;
}
function runListHTML(){
  let list=[...S.calcRuns].reverse();

  ${list.map(r=>`<tr><td><b>${esc(r.structure||"—")}</b><br/><small style="color:var(--faint)">${esc(r.code||"")}${r.version?" "+esc(r.version):""}</small></td>

}

    `<div class="field-row"><div><label class="f" for="mPaRate">Rating</label><select class="input" id="mPaRate" name="rating" style="margin-top:.32rem">${[0,1,2,3,4,5].map(i=>`<option value="${i}"${+p.rating===i?" selected":""}>${i===0?"—":"★".repeat(i)}</option>`).join("")}</select></div>

    `<details style="margin-top:.7rem"><summary class="sub" style="cursor:pointer">Ψ Quantum computing fields</summary>
     <div class="field-row" style="margin-top:.5rem"><div><label class="f" for="mPaQCat">Quantum category</label><select class="input" id="mPaQCat" name="quantumCategory" style="margin-top:.32rem"><option value="">— not quantum —</option>${qCatOpts}</select></div>

    ${S.studioItems.filter(m=>m.stage===st).map(m=>{const g=m.goalId?byId(S.goals,m.goalId):null;
      return `<div class="pipe-card"><b>${esc(m.title)}</b><small>${esc(m.kind||"")}${g?` · 🎯 ${esc(g.title)}`:""}</small>
      ${m.renderStatus?`<small>🎞 ${esc(m.renderStatus)}</small>`:""}${m.publishDate?`<small>📅 ${esc(m.publishDate)}</small>`:""}
      ${m.notes?`<small style="white-space:normal">${esc(m.notes.slice(0,80))}</small>`:""}
      <div class="pipe-nav"><button class="icon-btn" data-action="st-move" data-id="${m.id}" data-d="-1" aria-label="Move back" ${st===ST_STAGES[0]?"disabled":""}>◀</button><button class="icon-btn" data-action="edit-studio" data-id="${m.id}" aria-label="Edit">✎</button><button class="icon-btn" data-action="st-move" data-id="${m.id}" data-d="1" aria-label="Move forward" ${st===ST_STAGES[ST_STAGES.length-1]?"disabled":""}>▶</button><button class="icon-btn" data-action="del-studio" data-id="${m.id}" aria-label="Delete">✕</button></div></div>`;}).join("")}
    </div>`).join("")}</div></section>`).join("")}</div>`;

function viewStudio(){

}
function studioModal(s){
  const isNew=!s;s=s||{title:"",kind:"video",stage:"idea",goalId:"",audience:"",objective:"",hook:"",manimClass:"",renderStatus:"",publishDate:"",notes:"",lessons:""};

    `<label class="f" for="mStGoal">Linked goal</label><select class="input" id="mStGoal" name="goalId" style="margin-top:.32rem">${gOpts}</select>`+
    `<label class="f" for="mStNotes">Notes</label><textarea class="input" id="mStNotes" name="notes" rows="2" style="margin-top:.32rem" placeholder="Outline, links…">${esc(s.notes||"")}</textarea>`+

    v=>{const obj={title:String(v.title||"").trim()||"Untitled",kind:v.kind,stage:v.stage,goalId:v.goalId||null,

      manimClass:String(v.manimClass||"").trim(),renderStatus:String(v.renderStatus||"").trim(),publishDate:v.publishDate||"",
      notes:String(v.notes||"").trim(),lessons:String(v.lessons||"").trim(),updated:dayKey()};
      commit(isNew?"add-studio":"edit-studio",()=>{
        if(isNew)S.studioItems.push(Object.assign({id:uid()},obj));else Object.assign(s,obj);});

    isNew?"Add piece":"Save","🎬");
}

/* ============ LAYER 18 — Habitus Flip Clock ============ */
:root{
  --flip-first-half:180ms; --flip-second-half:220ms;
  --flip-ease-in:cubic-bezier(.55,.05,.67,.19); --flip-ease-out:cubic-bezier(.22,.61,.36,1);
  --digit-size:clamp(3.8rem,12vw,11rem);
  --fc-bg:#0a0d16; --fc-card:#161c2b; --fc-card2:#101524; --fc-digit:#eef2ff;
  --fc-accent:#8b5cf6; --fc-accent2:#22d3ee; --fc-dim:#8b94ad;
}
.flip-clock{--fc-gap:.55rem;display:flex;flex-direction:column;align-items:center;gap:.9rem;user-select:none}
.fc-digits{display:flex;align-items:stretch;gap:var(--fc-gap);perspective:1000px}
.fc-group{display:flex;gap:calc(var(--fc-gap)*.55)}
.fc-sep{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--digit-size)*.14);padding:0 .1rem}
.fc-sep i{width:calc(var(--digit-size)*.09);height:calc(var(--digit-size)*.09);border-radius:50%;background:#6b6b6b;opacity:.9}
.fc-sep.blink i{animation:fcblink 1s steps(2,start) infinite}
@keyframes fcblink{50%{opacity:.15}}
/* AM/PM like the reference: muted gray, right of the digits */
.fc-meridiem{font-size:calc(var(--digit-size)*.30);font-weight:700;letter-spacing:.04em;color:#8a8a8a;
  min-width:2.4em;text-align:left;align-self:center;padding-left:.35em;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
/* ---- minimal split-flap card (flat charcoal, bold white digits) ---- */
.flip{position:relative;width:calc(var(--digit-size)*.72);height:calc(var(--digit-size)*.98);font-size:calc(var(--digit-size)*.62);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:700;
  font-variant-numeric:tabular-nums;transform-style:preserve-3d;
  /* NOTE: never use filter:drop-shadow here — filter forces transform-style:flat and kills the 3D flip */
  box-shadow:0 14px 26px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.45);border-radius:10px}
.flip .half{position:absolute;left:0;width:100%;height:calc(50% - .5px);overflow:hidden;backface-visibility:hidden}
.flip .half span{position:absolute;left:0;width:100%;height:calc(var(--digit-size)*.98);line-height:calc(var(--digit-size)*.98);text-align:center;color:var(--fc-digit)}
.flip .top{top:0;border-radius:10px 10px 0 0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--fc-card) 88%,#fff 12%) 0%,var(--fc-card) 55%,color-mix(in srgb,var(--fc-card) 82%,#000 18%) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.flip .top span{top:0}
.flip .bottom{bottom:0;border-radius:0 0 10px 10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--fc-card2) 80%,#000 20%) 0%,var(--fc-card2) 60%,color-mix(in srgb,var(--fc-card2) 90%,#fff 10%) 100%);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.05)}
.flip .bottom span{bottom:0;top:auto}
/* hairline split */
.flip .hinge{position:absolute;top:50%;left:0;right:0;height:1px;margin-top:-.5px;background:rgba(0,0,0,.65);z-index:5}
.flip .edge{position:absolute;inset:0;border-radius:10px;pointer-events:none;z-index:6;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.28)}
.flip .leaf{position:absolute;left:0;width:100%;height:calc(50% - .5px);overflow:hidden;z-index:4;backface-visibility:hidden}
.flip .leaf span{position:absolute;left:0;width:100%;height:calc(var(--digit-size)*.98);line-height:calc(var(--digit-size)*.98);text-align:center;color:var(--fc-digit);font-weight:700}
.flip .leaf-top{top:0;transform-origin:bottom;border-radius:10px 10px 0 0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--fc-card) 88%,#fff 12%) 0%,var(--fc-card) 55%,color-mix(in srgb,var(--fc-card) 82%,#000 18%) 100%)}
.flip .leaf-top span{top:0}
.flip .leaf-bottom{bottom:0;transform-origin:top;border-radius:0 0 10px 10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--fc-card2) 80%,#000 20%) 0%,var(--fc-card2) 60%,color-mix(in srgb,var(--fc-card2) 90%,#fff 10%) 100%)}
.flip .leaf-bottom span{bottom:0;top:auto}
.flip .leaf.hidden{display:none}
.fc-label{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--fc-dim);font-weight:700}
.fc-sub{color:var(--fc-dim);font-size:.9rem;text-align:center;max-width:34rem;line-height:1.5}

  _persistT:0,_fUi:0,_psT:0,
  kick(){FC.kick();},
  needsTick(){return FC.instances.length>0||!!FOCUS||FC_BREAK.active||FC_PRES.running||FC_SW.running;},
  housekeep(now){
    try{this.checkFocus(now);}catch(e){}
    try{this.checkBreak(now);}catch(e){}
    try{this.checkPres(now);}catch(e){}
    if(FOCUS&&(!this._fUi||now-this._fUi>500)){this._fUi=now;try{tickFocus();}catch(e){}}
    if(now-this._persistT>5000){this._persistT=now;this.persist();}
    /* accessible current value — silent (aria-live=off), refreshed at most every 5s */
    if(!this._a11yT||now-this._a11yT>5000){this._a11yT=now;
      try{
        let v="";
        if(FOCUS)v="Focus session: "+a11yDur(Math.max(0,FOCUS.overtime?(Date.now()-FOCUS.overtimeStart)/1000:FOCUS.left))+(FOCUS.overtime?" overtime":" remaining");
        else if(FC_BREAK.active)v="Break: "+a11yDur(Math.max(0,(FC_BREAK.endsAt-now)/1000))+" remaining";
        else if(FC_PRES.running)v="Presentation: "+a11yDur(Math.max(0,(FC_PRES.pausedAcc+(FC_PRES.paused?0:now-FC_PRES.startedAt))/1000))+" elapsed";
        else if(FC_SW.running)v="Stopwatch: "+a11yDur(fcSwMs(now)/1000)+" elapsed";
        if(v)a11ySetValue(v);
      }catch(e){}
    }
  },
  checkFocus(now){
    const f=FOCUS;if(!f||f.paused)return;
    f.left=Math.max(0,(f.endsAt+f.pausedTotal-now)/1000);
    if(f.total>300&&!f._ann5&&f.left<=300){f._ann5=true;a11yAnnounce("Five minutes remaining.");}
    if(f.total>60&&!f._ann1&&f.left<=60&&f.left>0){f._ann1=true;a11yAnnounce("One minute remaining.");}
    if(f.left>0)return;
    if(S.clock.overtime&&!f.overtime){
      f.overtime=true;f.overtimeStart=Date.now();
      FC_Audio.focusDone(S.clock.volume);
      notifyUser("Focus session complete",(f.subject||"Session")+" is complete. Overtime counting.","habitus-focus-complete");
      a11yAnnounce("Focus session complete. Overtime counting.");
      toast("⏰ Time! Overtime counting — finish when ready.");
      return;
    }
    if(!f.overtime)endFocusSession(true);
  },
  checkBreak(now){
    const b=FC_BREAK;if(!b.active)return;
    if(now<b.endsAt)return;
    b.active=false;
    const rec=S.breaks.find(x=>x.id===b.recId);
    if(rec)commit("break-done",()=>{rec.actualSeconds=Math.max(0,Math.round((Date.now()-(b.startedAt||Date.now()))/1000));
      rec.endedAt=Date.now();rec.status="completed";rec.updatedAt=Date.now();});
    FC_Audio.breakDone(S.clock.volume);
    notifyUser("Break over","Ready for the next session?","habitus-break-done");
    a11yAnnounce("Break over. Ready for the next session.");
    toast("☕ Break over — ready?");
    this.persist();
    try{if(document.getElementById("fcOverlay"))renderFcPanel();}catch(e){}
  },
  checkPres(now){
    const p=FC_PRES,c=S.clock;
    if(!p.running||p.paused||p.dir!=="down")return;
    const el=(p.pausedAcc+(now-p.startedAt))/1000,rem=p.total-el;
    const{w1,w2}=fcPresWarnSecs();
    if(rem<=w1&&rem>0&&!p._w1&&w1>0){p._w1=true;fcPresWarn("first",rem);}
    if(rem<=w2&&rem>0&&!p._w2&&w2>0){p._w2=true;fcPresWarn("final",rem);}
    if(rem<=0&&!p.finished){
      p.finished=true;
      /* canonical presentation practice record */
      try{
        const elSecs=Math.round((p.pausedAcc+(Date.now()-p.startedAt))/1000);
        const{w1,w2}=fcPresWarnSecs();
        const rec=meta51({id:uid(),title:p.title||"Presentation",
          linkedProjectId:p.linkedProjectId||null,linkedStudioItemId:p.linkedStudioItemId||null,
          direction:p.dir,plannedSeconds:p.total,actualSeconds:elSecs,
          overtimeSeconds:c.presOvertime?Math.max(0,elSecs-p.total):0,
          warningConfiguration:{mode:c.presWarnMode,warn1:c.presWarn1,warn2:c.presWarn2},
          warningsTriggered:{first:!!p._w1,final:!!p._w2},
          startedAt:p.startedAt,endedAt:Date.now(),
          confidence:null,pacingQuality:null,sectionsRunningLong:[],notes:"",status:"completed"});
        commit("pres-complete",()=>{S.presentations.push(rec);});
      }catch(e){Diag.log("timer","presentation record save failed",e.message);}
      if(!c.presSilent)FC_Audio.bell(c.volume,880,1.5);
      notifyUser("Presentation time","Time is up.","habitus-pres-done");
      a11yAnnounce("Presentation time is up.");
      try{if(navigator.vibrate&&c.presVibrate)navigator.vibrate([120,60,120]);}catch(e){}
      if(!c.presOvertime){fcPresStop();toast("⏰ Time!");}
      this.persist();
      try{if(document.getElementById("fcOverlay"))renderFcPanel();}catch(e){}
    }
  },
  _lastSnap:"",
  persist(){
    try{persistFocusSoon();}catch(e){}
    if(!DB.available)return;
    const now=Date.now();
    let snap;
    try{
      snap={
        sw:(FC_SW.running||FC_SW.elapsed>0)?{running:FC_SW.running,elapsed:Math.round(fcSwMs(now)),laps:(FC_SW.laps||[]).slice(-60),link:FC_SW.link||null,label:FC_SW.label||"",savedAt:now}:null,
        brk:FC_BREAK.active?{endsAt:FC_BREAK.endsAt,total:FC_BREAK.total,startedAt:FC_BREAK.startedAt||now,label:FC_BREAK.label||"Break",savedAt:now}:null,
        pres:(FC_PRES.running||FC_PRES.pausedAcc>0)?{running:FC_PRES.running,paused:FC_PRES.paused,elapsed:Math.round(FC_PRES.paused?FC_PRES.pausedAcc:FC_PRES.pausedAcc+(FC_PRES.running?(now-FC_PRES.startedAt):0)),total:FC_PRES.total,dir:FC_PRES.dir,finished:!!FC_PRES.finished,savedAt:now}:null,
        fs:document.getElementById("fcFull")?{mode:fcFullMode||"clock",savedAt:now}:null
      };
    }catch(e){return;}
    const key=JSON.stringify(snap,(k,v)=>k==="savedAt"?0:v);
    if(key===this._lastSnap)return; /* unchanged — skip the write */
    this._lastSnap=key;
    try{
      DB.putMeta("timer.sw",snap.sw).catch(()=>{});
      DB.putMeta("timer.break",snap.brk).catch(()=>{});
      DB.putMeta("timer.pres",snap.pres).catch(()=>{});
      DB.putMeta("timer.fs",snap.fs).catch(()=>{});
    }catch(e){}
  },
  persistSoon(){clearTimeout(this._psT);this._psT=setTimeout(()=>this.persist(),800);}
};
function fcMountFlip(mountId,opts,getString,onTick){
  const mount=document.getElementById(mountId);
  if(!mount)return null;
  const fc=new FlipClock(mount,opts||{});
  const inst={mount,clock:fc,getString,onTick,_lastStr:null};
  const first=getString(Date.now());
  fc.build(first);inst._lastStr=first;
  return FC.add(inst);
}
/* ---------- clock mode strings ---------- */
function fcClockParts(date,tz){
  try{
    const fmt=new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:S.clock.h12,timeZone:tz||undefined});
    const p={};fmt.formatToParts(date).forEach(x=>p[x.type]=x.value);
    return{h:p.hour,m:p.minute,s:p.second,ap:(p.dayPeriod||"").toUpperCase()};
  }catch(e){
    const d=date;let h=d.getHours();
    const ap=S.clock.h12?(h>=12?"PM":"AM"):"";
    if(S.clock.h12){h=h%12||12;}
    return{h:String(h).padStart(2,"0"),m:String(d.getMinutes()).padStart(2,"0"),s:String(d.getSeconds()).padStart(2,"0"),ap};
  }
}
function fcClockString(now,tz){
  const p=fcClockParts(new Date(now),tz);
  return S.clock.seconds?`${p.h}:${p.m}:${p.s}`:`${p.h}:${p.m}`;
}
function fcDateLine(now,tz){
  try{
    return new Intl.DateTimeFormat(undefined,{weekday:"long",month:"long",day:"numeric",timeZone:tz||undefined}).format(new Date(now));
  }catch(e){return new Date(now).toDateString();}
}
function fcTzLabel(){
  try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"";}catch(e){return "";}
}
/* ---------- countdown helpers (focus) ---------- */
function fcFocusLeft(now){
  const f=FOCUS;if(!f)return null;
  if(f.paused)return Math.max(0,f.left);
  return Math.max(0,(f.endsAt+f.pausedTotal-now)/1000);
}
function fcCountdownString(now){
  const left=fcFocusLeft(now);
  if(left==null)return S.clock.seconds?"00:00:00":"00:00";
  const f=FOCUS;
  if(f.overtime){
    const ot=Math.floor((now-f.overtimeStart)/1000);
    return "+"+fmtDur(ot);
  }
  return fmtDur(Math.ceil(left));
}
function fmtDur(totalSec){
  totalSec=Math.max(0,Math.floor(totalSec));
  const h=Math.floor(totalSec/3600),m=Math.floor(totalSec%3600/60),s=totalSec%60;
  if(h>0)return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return S.clock.seconds?`00:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
/* extend / shrink a running focus countdown */
function fcAdjustFocus(minutes){
  const f=FOCUS;if(!f||f.overtime)return;
  const leftMin=f.left/60;
  if(minutes<0&&-minutes>=leftMin-0.02){
    if(!confirm(`Subtract ${-minutes} min? Only ${Math.max(1,Math.ceil(leftMin))} min remain — this will end the session.`))return;
  }
  const beforeMin=Math.round(f.left/60);
  f.endsAt+=minutes*60000;
  f.total=Math.max(60,f.total+minutes*60);
  f.left=Math.max(0,(f.endsAt+f.pausedTotal-Date.now())/1000);
  f.adjustedMin=Math.round(f.total/60);
  (f.adjustments=f.adjustments||[]).push({at:Date.now(),deltaMin:minutes,leftBeforeMin:beforeMin});
  TE.persistSoon();
  a11yAnnounce(minutes>0?`Added ${minutes} minutes. ${a11yDur(f.left)} remaining.`:`Subtracted ${-minutes} minutes. ${a11yDur(f.left)} remaining.`);
  toast((minutes>0?"+":"")+minutes+" min");
  if(f.left<=0){endFocusSession(true);return;}
  if(document.getElementById("fcOverlay"))renderFcPanel();
}

function fcAnalyticsHTML(){
  const from=dayKey(addDays(new Date(),-29));
  const ss=S.focusSessions.filter(s=>s.date>=from&&isFocusSession(s));
  if(!ss.length)return `<p class="sub">No focus sessions in the last 30 days yet.</p>`;
  /* exact status filters — never lump non-completed together */
  const byStatus={};for(const s of ss){const st=s.status||(s.completed?"completed":"ended-early");byStatus[st]=(byStatus[st]||0)+1;}
  const doneN=(byStatus["completed"]||0)+(byStatus["completed-with-overtime"]||0)+(byStatus["recovered-and-completed"]||0);
  const comp=Math.round(100*doneN/ss.length);
  const sec=s=>s.actualFocusedSeconds??Math.round((s.minutes||0)*60);
  const totSec=ss.reduce((a,s)=>a+sec(s),0);
  const avgOT=ss.reduce((a,s)=>a+(s.overtimeSeconds??Math.round((s.overtimeMin||0)*60)),0)/ss.length;
  const avgPaused=ss.reduce((a,s)=>a+(s.pausedSeconds??Math.round((s.pausedMin||0)*60)),0)/ss.length;
  const hrs=ss.reduce((a,s)=>a+(+s.distractions||0),0);
  const intPerHr=totSec>0?(hrs/(totSec/3600)).toFixed(1):"0";
  const avgQ=(ss.reduce((a,s)=>a+(+s.quality||0),0)/ss.length).toFixed(1);
  const byHour={};ss.forEach(s=>{if(s.startedAt){const h=new Date(s.startedAt).getHours();byHour[h]=(byHour[h]||0)+sec(s);}});
  const bestH=Object.entries(byHour).sort((a,b)=>b[1]-a[1])[0];
  const byDur={};ss.forEach(s=>{const d=Math.round((s.originalPlannedSeconds??(s.plannedMin||s.minutes||0)*60)/60);byDur[d]=(byDur[d]||0)+1;});
  const bestD=Object.entries(byDur).sort((a,b)=>b[1]-a[1])[0];
  /* break compliance */
  const brks=S.breaks.filter(b=>(b.startedAt||0)>=Date.now()-30*86400000);
  const brkDone=brks.filter(b=>b.status==="completed").length;
  const rows=[
    ["Completion rate",comp+"%",`completed ÷ all focus sessions (30d, n=${ss.length})`],
    ["Completed",byStatus["completed"]||0,"status = completed"],
    ["Completed with overtime",byStatus["completed-with-overtime"]||0,"status = completed-with-overtime"],
    ["Ended early",byStatus["ended-early"]||0,"status = ended-early"],
    ["Cancelled",byStatus["cancelled"]||0,"status = cancelled"],
    ["Interrupted",byStatus["interrupted"]||0,"status = interrupted"],
    ["Avg overtime",(avgOT/60).toFixed(1)+" min","Σ overtimeSeconds ÷ sessions"],
    ["Avg paused",(avgPaused/60).toFixed(1)+" min","Σ pausedSeconds ÷ sessions"],
    ["Focused time",fmtP(totSec),"Σ actualFocusedSeconds (30d)"],
    ["Interruptions / hour",intPerHr,"distractions ÷ focused hours"],
    ["Avg quality",avgQ+" / 5","mean self-rating"],
    ["Most productive",bestH?bestH[0]+":00":"—","hour with most focused seconds"],
    ["Most-used duration",bestD?bestD[0]+" min":"—","mode of originalPlannedSeconds"],
    ["Breaks completed",brks.length?`${brkDone}/${brks.length}`:"No data","break records, 30d"],
  ];
  return `<div class="grid g2">${rows.map(r=>`<div class="kv" title="${esc(r[2]||"")}"><span class="k">${r[0]}</span><span class="mono"><b>${r[1]}</b></span></div>`).join("")}</div>
  <p class="sub" style="color:var(--faint);margin-top:.5rem">Every metric shows its formula on hover. Included: focus sessions (Stopwatch/Calculation/Practice excluded), last 30 days. Excluded: none hidden.</p>`;
}

function a11yEnsure(){

/* Current accessible value — updated silently (aria-live=off), never announced per second. */
function a11ySetValue(text){

/* Announce only key transitions (start/pause/resume/warnings/completion/laps) — never every second. */
function a11yAnnounce(msg){
  try{
    const{ann}=a11yEnsure();
    if(ann.dataset.last===msg)return;
    ann.dataset.last=msg;ann.textContent="";
    const set=()=>{ann.textContent=msg;};
    if(typeof requestAnimationFrame==="function")requestAnimationFrame(set);else set();
  }catch(e){}
}
function a11yDur(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60,parts=[];
  if(h)parts.push(h+(h===1?" hour":" hours"));
  if(m)parts.push(m+(m===1?" minute":" minutes"));
  if(s||!parts.length)parts.push(s+(s===1?" second":" seconds"));
  return parts.join(" ");
}

function renderFcFull(){

  if(fcFullInst){FC.remove(fcFullInst);fcFullInst=null;}
  const m=fcFullMode,t=fcFullTitle();
  document.getElementById("fcFullTitle").textContent=t.title;
  document.getElementById("fcFullLink").textContent=t.link;
  let getStr,ui="";
  const bottom=document.getElementById("fcFullBottom");
  if(m==="clock"){getStr=now=>fcClockString(now);}
  else if(m==="countdown"){
    if(!FOCUS){fcFullClose();openClock("countdown");return;}
    getStr=now=>fcCountdownString(now);
    ui=`<div class="fc-controls">
      <button class="fc-btn" data-action="f-pause">${FOCUS.paused?"▶ Resume":"⏸ Pause"}</button>
      <button class="fc-btn primary" data-action="f-end">■ Finish</button>
      <button class="fc-btn" data-action="f-dist">⚡ Distraction</button></div>`;
  }
  else if(m==="stopwatch"){getStr=now=>{const ms=fcSwMs(now),tt=Math.floor(ms/1000);return `${String(Math.floor(tt/60)).padStart(2,"0")}:${String(tt%60).padStart(2,"0")}`;};
    ui=`<div class="fc-controls">${FC_SW.running?`<button class="fc-btn" data-action="fc-sw-pause">⏸ Pause</button>`:`<button class="fc-btn primary" data-action="fc-sw-start">▶ Start</button>`}${FC_SW.running?`<button class="fc-btn" data-action="fc-sw-lap">🏁 Lap</button>`:""}</div>`;}
  else{getStr=now=>fcPresString(now);
    ui=`<div class="fc-controls">${FC_PRES.running?`<button class="fc-btn" data-action="fc-pres-pause">${FC_PRES.paused?"▶ Resume":"⏸ Pause"}</button>`:`<button class="fc-btn primary" data-action="fc-pres-start">▶ Start</button>`}</div>`;}
  bottom.innerHTML=ui;
  const fc=new FlipClock(mount,{});
  fcFullInst={mount,clock:fc,getString:getStr,onTick:now=>{const tt=fcFullTitle();
    const te=document.getElementById("fcFullTitle"),le=document.getElementById("fcFullLink");
    if(te&&te.textContent!==tt.title)te.textContent=tt.title;
    if(le&&le.textContent!==tt.link)le.textContent=tt.link;
    if(m==="clock"){const fm=document.getElementById("fcFullMeridiem");
      if(fm){const ap=(S.clock.h12&&fcClockParts(new Date(now)).ap)||"";if(fm.textContent!==ap)fm.textContent=ap;}}},_lastStr:null};
  const first=getStr(Date.now());fc.build(first);fcFullInst._lastStr=first;
  FC.add(fcFullInst);
}
document.addEventListener("fullscreenchange",()=>{
  if(document.fullscreenElement)return;
  fcWakeLock(false); /* release immediately on native exit */
  if(document.getElementById("fcFull")&&!S.clock.keepImmersive)fcFullClose();
});

/* ---------- custom countdown helpers ---------- */
function fcSyncCustom(secs){
  secs=clamp(60,86400,Math.round(secs));
  const h=document.getElementById("fcCustomH"),m=document.getElementById("fcCustomM"),s=document.getElementById("fcCustomS");
  if(h)h.value=Math.floor(secs/3600);
  if(m)m.value=Math.floor(secs%3600/60);
  if(s)s.value=secs%60;
  if(fcPanelInst){try{const str=fmtDur(secs);fcPanelInst.clock.set(str);fcPanelInst._lastStr=str;}catch(e){}}
}
function fcReadCustomSecs(){
  const g=id=>+((document.getElementById(id)||{}).value)||0;
  const h=clamp(0,23,g("fcCustomH")),m=clamp(0,59,g("fcCustomM")),s=clamp(0,59,g("fcCustomS"));
  return h*3600+m*60+s;
}
/* Save stopwatch as one of four distinct record types — never double-counted. */
function fcSwSaveAs(type){
  if(!FC_SW.elapsed&&!FC_SW.laps.length)return;
  const lk=FC_SW.link||{},mins=Math.max(1,Math.round(FC_SW.elapsed/60000));
  const now=Date.now(),startWall=FC_SW.wallStart||(now-FC_SW.elapsed);
  const task=lk.kind==="task"?byId(S.tasks,lk.id):null;
  const linkIds={taskId:lk.kind==="task"?lk.id:null,blockId:lk.kind==="block"?lk.id:null,
    projectId:lk.kind==="project"?lk.id:(task?task.projectId:null),
    calcRunId:lk.kind==="calc"?lk.id:null,topicId:lk.kind==="topic"?lk.id:null,
    problemId:lk.kind==="gre"?lk.id:null,studioId:lk.kind==="studio"?lk.id:null};
  const base={id:uid(),date:dayKey(),subject:FC_SW.label||"Timed activity",minutes:mins,
    distractions:0,quality:3,difficulty:3,energy:3,link:FC_SW.link,...linkIds,
    outcome:`${FC_SW.laps.length} lap(s)`,startedAt:startWall,endedAt:now,
    note:"Saved from stopwatch",status:"completed"};
  Modal.close();
  if(type==="actual"){
    /* Actual Work → write actuals onto the linked block, or an unplanned-work block */
    const d0=new Date(startWall),aS=d0.getHours()*60+d0.getMinutes();
    const d1=new Date(now),aE=d1.getHours()*60+d1.getMinutes();
    let blk=lk.kind==="block"?byId(S.timelineBlocks,lk.id):null;
    commit("sw-actual",()=>{
      if(blk){
        blk.actualStart=aS;blk.actualEnd=aE;blk.status="done";blk.done=true;
        blk.sessionIds=[...(blk.sessionIds||[]),base.id];
        blk.outcome=[blk.outcome||"",`${FC_SW.laps.length} lap(s) via stopwatch`].filter(Boolean).join(" · ");
      }else{
        blk={id:uid(),date:dayKey(),title:base.subject,start:aS,dur:Math.max(5,Math.round((now-startWall)/60000)),
          done:true,status:"done",domain:"Unplanned",taskId:linkIds.taskId,projectId:linkIds.projectId,
          intention:"",buffer:false,actualStart:aS,actualEnd:aE,varianceReason:"unplanned",
          outcome:`${FC_SW.laps.length} lap(s)`,sessionIds:[base.id]};
        S.timelineBlocks.push(blk);
      }
      /* canonical record is the block's actuals alone — no session copy, so nothing double-counts */
    });
    Regions.plannerBlocks();updateMiniScore();
    toast("Recorded as actual work 📅");
  }else{
    const types={focus:"Stopwatch",calc:"Calculation",practice:"Practice"};
    commit("sw-save",()=>{S.focusSessions.push({...base,type:types[type]||"Stopwatch"});});
    Regions.sessions();updateMiniScore();
    toast({focus:"Saved as focus session ◉",calc:"Saved as calculation activity 🧪",practice:"Saved as practice session 📝"}[type]||"Saved ✓");
  }
  FC_SW.running=false;FC_SW.elapsed=0;FC_SW.laps=[];FC_SW.label="";FC_SW.link=null;FC_SW.wallStart=0;
  TE.persistSoon();renderFcPanel();
}

function fcWcList(){
  return (S.clock.worldClocks||[]).map(w=>
    typeof w==="string"?{tz:w,label:w.split("/").pop().replace(/_/g," ")}:{tz:w.tz,label:w.label||w.tz}
  ).filter(w=>w&&w.tz);
}
function fcTzOffset(tz){
  try{
    const now=new Date();
    const mins=Math.round((new Date(now.toLocaleString("en-US",{timeZone:tz}))-new Date(now.toLocaleString("en-US",{timeZone:"UTC"})))/60000);
    const a=Math.abs(mins);
    return `UTC${mins<0?"−":"+"}${String(Math.floor(a/60)).padStart(2,"0")}:${String(a%60).padStart(2,"0")}`;
  }catch(e){return "";}
}
function fcWcTime(tz){
  try{return new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",hour12:S.clock.h12,timeZone:tz}).format(new Date());}
  catch(e){return "--:--";}
}
function fcWcRender(q){
  const host=document.getElementById("fcWcResults");if(!host)return;
  const needle=String(q||"").trim().toLowerCase();
  const added=new Set(fcWcList().map(w=>w.tz));
  const hits=FC_CITIES.filter(([city,country,tz])=>!needle||city.toLowerCase().includes(needle)||country.toLowerCase().includes(needle)||tz.toLowerCase().includes(needle)).slice(0,40);
  host.innerHTML=hits.length?hits.map(([city,country,tz])=>{
    const has=added.has(tz);
    return `<div class="row-item"><div class="t"><b>${esc(city)}</b><small>${esc(country)} · ${esc(tz)} · ${fcTzOffset(tz)} · ${fcWcTime(tz)} now</small></div>
      <button class="btn btn-xs ${has?"btn-ghost":"btn-primary"}" data-action="fc-wc-pick" data-v="${esc(tz)}" data-city="${esc(city)}" ${has?"disabled":""}>${has?"✓ Added":"Add"}</button></div>`;
  }).join(""):`<p class="sub">No matches. Try a city, country, or region name.</p>`;
}

/* keyboard shortcuts */
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const overlay=document.getElementById("fcOverlay"),full=document.getElementById("fcFull");
  const inClock=!!(overlay||full);
  if(!inClock)return;
  const mode=full?fcFullMode:fcPanelMode;
  const k=e.key;
  const prevent=()=>e.preventDefault();
  if(k===" "){prevent();if(mode==="countdown"&&FOCUS)Actions["f-pause"]();else if(mode==="stopwatch")(FC_SW.running?FC_ACTIONS["fc-sw-pause"]:FC_ACTIONS["fc-sw-start"])();else if(mode==="presentation")(FC_PRES.running?FC_ACTIONS["fc-pres-pause"]:FC_ACTIONS["fc-pres-start"])();}
  else if(k==="f"||k==="F"){prevent();full?fcFullClose():fcFullOpen();}
  else if(k==="r"||k==="R"){if(mode==="stopwatch"&&confirm("Reset the stopwatch?")){prevent();FC_ACTIONS["fc-sw-reset"]();}}

/* ---------- 19.3 evidence-based mastery (transparent formula) ----------
   Dimensions: explain / derive / solve / implement / retain.
   Level map: not-tested=0, needs-work=1, adequate=2, strong=3.
   demonstrated: every applicable dimension ≥ adequate.
   mastered: demonstrated AND retain ≥ adequate AND ≥1 review after demonstration.
   The UI always shows the reasons — never a bare percentage. */
function qMastery(t){
  const ev=t.evidence||{};
  const dims=Q_EVIDENCE_DIMS.filter(d=>!(d==="implement"&&t.implementNA));
  const score=d=>Q_EVIDENCE_LEVELS[ev[d]]??0;
  const tested=dims.filter(d=>score(d)>0);
  const allAdequate=dims.length>0&&dims.every(d=>score(d)>=2);
  const retainOk=score("retain")>=2&&(t.reviewCount||0)>=1;
  const reasons=[];
  for(const d of dims){
    const s=score(d);
    reasons.push({dim:d,level:ev[d]||"not-tested",
      ok:s>=2,note:s>=2?"adequate or better":s===1?"needs work":"not tested"});
  }
  let level="not-started";
  if(t.firstStudiedAt)level="learning";
  if(t.status==="practicing"||tested.some(d=>["solve","implement"].includes(d)))level="practicing";
  if(allAdequate)level="demonstrated";
  if(allAdequate&&retainOk)level="mastered";
  const avg=tested.length?tested.reduce((a,d)=>a+score(d),0)/tested.length:0;
  return{level,avg:Math.round(avg*10)/10,tested:tested.length,total:dims.length,allAdequate,retainOk,reasons};
}
function qMasteryLine(t){
  const m=qMastery(t);
  return `${m.level} · evidence ${m.tested}/${m.total} dims tested · avg ${m.avg}/3`;
}

function qNextReviewDate(result,prevInterval){
  const d=new Date();let days;
  if(result==="forgot")days=1;
  else if(result==="partial")days=2;
  else if(result==="correct-with-help")days=4;
  else if(result==="correct")days=Math.min(60,Math.max(7,(prevInterval||7)*2));
  else days=Math.min(90,Math.max(14,(prevInterval||14)*2));
  d.setDate(d.getDate()+days);
  return dayKey(d);
}
function qReviewDue(t){
  if(!t.nextReviewAt)return false;
  return t.nextReviewAt<=dayKey();
}
function qReviewQueue(){
  const now=dayKey();
  return S.quantumTopics.filter(t=>!["paused","skipped","mastered"].includes(t.status)&&t.nextReviewAt&&t.nextReviewAt<=now)
    .sort((a,b)=>{
      const od=(a.nextReviewAt<now?0:1)-(b.nextReviewAt<now?0:1);
      if(od)return od;
      const ma=qMastery(a).avg,mb=qMastery(b).avg;
      if(ma!==mb)return ma-mb;
      return (b.importance||3)-(a.importance||3);
    });
}

function qReviewModal(t){
  const prompts=["Explain from memory","Write key equations","Solve one representative problem",
    "Draw or construct the circuit","Predict measurement results","Write a small Qiskit implementation",
    "Identify common misconceptions","Compare with a related concept","State practical limitations"];
  openModal("Review: "+t.title,"Spaced review — repetition alone never proves mastery.",
    `<p class="ob-sub2">Work through the prompts, then record an honest result.</p>
     <ol style="margin:.4rem 0 .8rem 1.2rem;display:flex;flex-direction:column;gap:.3rem">
     ${prompts.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
     <div class="field-row"><div><label class="f" for="qrRes">Result</label><select class="input" id="qrRes" name="result" style="margin-top:.32rem">${Q_REVIEW_RESULTS.map(r=>`<option value="${r}">${Q_REVIEW_LABELS[r]}</option>`).join("")}</select></div>
     <div>${field("Time spent (min)","minutes","15","number")}</div></div>
     <div class="field-row"><div>${field("Confidence before (1–5)","confB","3","number")}</div><div>${field("Confidence after (1–5)","confA","3","number")}</div></div>
     <label class="f" for="qrMist">Mistakes / error categories</label>
     <select class="input" id="qrMist" name="mistakes" multiple size="4" style="margin-top:.32rem;min-height:80px">${Q_ERROR_CATS.map(c=>`<option value="${c}">${Q_ERROR_LABELS[c]}</option>`).join("")}</select>
     <div style="margin-top:.5rem">${field("One next action","nextAction","","e.g. Redo the phase-estimation derivation")}</div>`,
    v=>{
      const mistakes=Array.from(document.querySelectorAll('#qrMist option:checked')).map(o=>o.value);
      const result=v.result,mins=clamp(1,600,+v.minutes||15);
      const prevInterval=t.lastReviewedAt&&t.nextReviewAt?Math.max(1,Math.round((Date.parse(t.nextReviewAt)-t.lastReviewedAt)/86400000)):0;
      const next=qNextReviewDate(result,prevInterval);
      const now=Date.now();
      Repos.add("quantumReviews",{topicId:t.id,result,confidenceBefore:clamp(1,5,+v.confB||3),
        confidenceAfter:clamp(1,5,+v.confA||3),timeSpentSeconds:mins*60,mistakes,
        nextAction:String(v.nextAction||"").trim(),nextReviewAt:next,createdAt:now},"q-review");
      /* update the topic: confidence, demonstrated evidence, schedule, time */
      const patch={lastReviewedAt:now,nextReviewAt:next,reviewCount:(t.reviewCount||0)+1,
        totalStudySeconds:(t.totalStudySeconds||0)+mins*60,lastStudiedAt:now,
        confidence:clamp(1,5,+v.confA||3)};
      const ev=Object.assign({},t.evidence||{});
      /* a review is a retention test — never auto-mastery, but honest evidence */
      if(result==="strong"||result==="correct")ev.retain=ev.retain==="strong"?"strong":"adequate";
      else if(result==="correct-with-help")ev.retain=ev.retain==="not-tested"?"not-tested":"needs-work";
      else if(result==="forgot"||result==="partial")ev.retain="needs-work";
      patch.evidence=ev;
      if(!t.firstStudiedAt)patch.firstStudiedAt=now;
      Repos.update("quantumTopics",t.id,patch,"q-review-topic");
      QuantumWorkspace.render();
      toast(`Review recorded: ${Q_REVIEW_LABELS[result]} · next ${next}`);
    },"Record review","🔁");
}

    ["Recent noncritical errors",Diag.list().length?Diag.list().slice(0,5).map(e=>`${e.area}: ${e.msg}`).join(" · "):"none"]];
  return rows.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="mono">${esc(String(v))}</span></div>`).join("")
    +`<div id="diagScanOut" style="margin-top:.6rem"></div>`;

async function diagScan(){
  const out=document.getElementById("diagScanOut");
  if(out)out.innerHTML=`<p class="sub">Scanning…</p>`;
  const issues=[];
  /* broken references */
  const kinds={};for(const k of ENTITY_KINDS)kinds[k]=S[k]||[];
  for(const i of integrityCheck51(kinds))issues.push(["Broken reference",i]);
  /* duplicate ids */
  for(const k of ENTITY_KINDS){if(k==="trash")continue;const seen=new Set();
    for(const x of S[k]||[]){if(!x)continue;if(seen.has(x.id))issues.push(["Duplicate id",`${k}: ${x.id}`]);seen.add(x.id);}}
  /* invalid durations */
  for(const s of S.focusSessions||[]){
    if(s.originalPlannedSeconds!=null&&!(s.originalPlannedSeconds>=0))issues.push(["Invalid duration",`session ${s.id}`]);
    if(s.actualFocusedSeconds!=null&&s.actualFocusedSeconds<0)issues.push(["Invalid duration",`session ${s.id}`]);}
  /* orphaned sessions (linked block/task gone, link not null) */
  for(const s of S.focusSessions||[]){
    if(s.blockId&&!Repos.byId("timelineBlocks",s.blockId))issues.push(["Orphaned session link",`session "${s.subject}" → block ${s.blockId}`]);}
  /* missing linked topics */
  for(const e of S.quantumExercises||[])if(e.topicId&&!qTopicById(e.topicId))issues.push(["Missing topic",`exercise "${e.title}"`]);
  const html=issues.length
    ?`<p class="sub" style="color:var(--warn)">${issues.length} issue(s) found:</p>`+issues.slice(0,30).map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="sub">${esc(v)}</span></div>`).join("")
    :`<p class="sub" style="color:var(--good)">✓ No issues found.</p>`;
  if(out)out.innerHTML=html;
  Diag.log("diagnostics",`integrity scan: ${issues.length} issues`);
  return issues;
}

function qStageName(n){const s=Q_ROADMAP.find(x=>x.n===n);return s?`Stage ${n} · ${s.name}`:`Stage ${n}`;}
function qTopicById(id){return S.quantumTopics.find(t=>t.id===id)||null;}
function qMissingPrereqs(t){
  return (t.prerequisiteIds||[]).map(qTopicById).filter(p=>p&&!["demonstrated","mastered"].includes(qMastery(p).level));

function qCurrentStage(){
  /* transparent: the lowest stage with any topic not yet demonstrated/mastered/skipped */
  for(const st of Q_ROADMAP){
    const topics=S.quantumTopics.filter(t=>t.stage===st.n);
    if(topics.some(t=>!["demonstrated","mastered","skipped"].includes(qMastery(t).level)))return st.n;
  }

function qRecommend(){
  /* decision order: overdue review → weak evidence → planned → next new topic */
  const q=qReviewQueue();
  if(q.length){const t=q[0];
    const overdue=Math.max(0,Math.round((Date.now()-Date.parse(t.nextReviewAt))/86400000));
    return{kind:"review",topic:t,title:`Review: ${t.title}`,
      reason:`${overdue>0?`Overdue by ${overdue}d`:"Due today"} · evidence: ${qMasteryLine(t)}`,
      effort:"1 session"};}
  const cands=S.quantumTopics.filter(t=>["should-learn","planned","learning","practicing"].includes(t.status));
  cands.sort((a,b)=>(b.importance||3)-(a.importance||3)||a.stage-b.stage);
  if(cands.length){const t=cands[0];const miss=qMissingPrereqs(t);
    return{kind:"study",topic:t,title:`Continue: ${t.title}`,
      reason:`${Q_TOPIC_STATUS_META[t.status].label} · ${miss.length?`missing foundations: ${miss.map(m=>m.title).join(", ")}`:"prerequisites satisfied"}`,
      effort:"1–2 sessions"};}
  const fresh=S.quantumTopics.filter(t=>t.status==="not-started").sort((a,b)=>a.stage-b.stage||(b.importance||3)-(a.importance||3));
  if(fresh.length){const t=fresh[0];const miss=qMissingPrereqs(t);
    return{kind:"study",topic:t,title:`Next: ${t.title}`,
      reason:`${qStageName(t.stage)} · ${miss.length?`missing foundations: ${miss.map(m=>m.title).join(", ")}`:"ready to start"}`,
      effort:"2 sessions"};}
  return null;
}

  const topics=new Set();sess.forEach(s=>{if(s.linkedQuantumTopicId)topics.add(s.linkedQuantumTopicId);});
  const ex=S.quantumExercises.filter(e=>(e.completedAt||0)>=from);

  const exp=S.quantumExperiments.filter(e=>["completed","analyzed","documented","reproduced"].includes(e.status)&&(e.completedAt||e.updatedAt||0)>=from);

function qPapersCSV(){
  const rows=[["Paper","Year","Category","Problem","Method","System","Qubits","Hardware","Main result","Claim","Limitation","Relevance","Status"]];
  for(const p of S.papers.filter(p=>p.quantumCategory)){
    rows.push([p.title,p.year||"",Q_PAPER_CAT_LABELS[p.quantumCategory]||"",p.researchQuestion||"",
      p.method||"",p.material||"","",p.url||"",p.mainResult||"",p.claimedAdvantage||"",p.limitation||"",
      p.relevance||"",p.readingStage||"inbox"]);
  }
  const csv=rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="quantum-papers.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("Literature matrix exported ⤓");
}

function qInsightsHTML(){
  const topics=S.quantumTopics;
  const byStage=Q_ROADMAP.map(st=>{
    const ts=topics.filter(t=>t.stage===st.n);
    const secs=ts.reduce((a,t)=>a+(t.totalStudySeconds||0),0);

  });
  const byStatus={};for(const t of topics)byStatus[t.status]=(byStatus[t.status]||0)+1;
  const ex=S.quantumExercises;
  const solved=ex.filter(e=>e.status==="solved").length;
  const errFreq={};for(const e of ex)for(const c of e.errorCategories||[])errFreq[c]=(errFreq[c]||0)+1;
  const topErr=Object.entries(errFreq).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const mismatched=topics.filter(t=>t.confidence>=4&&qMastery(t).avg<2&&qMastery(t).tested>0);
  const revDone=S.quantumReviews.length;
  const xpDone=S.quantumExperiments.filter(e=>["completed","analyzed","documented","reproduced"].includes(e.status)).length;
  const projDone=S.quantumProjects.filter(p=>p.status==="completed").length;
  const papersRead=S.papers.filter(p=>p.quantumCategory&&["annotated","summarized","critiqued","reproduced","cited"].includes(p.readingStage)).length;
  const neglected=topics.filter(t=>(t.importance||3)>=4&&!["demonstrated","mastered","skipped"].includes(qMastery(t).level))
    .sort((a,b)=>(a.lastStudiedAt||0)-(b.lastStudiedAt||0))[0];
  const bottlenecks=topics.filter(t=>{const miss=qMissingPrereqs(t);return miss.length>0&&["learning","practicing"].includes(t.status);}).slice(0,5);
  const theory=topics.filter(t=>t.implementNA||["explain","derive"].some(d=>(Q_EVIDENCE_LEVELS[(t.evidence||{})[d]]??0)>=2)).length;
  const impl=topics.filter(t=>(Q_EVIDENCE_LEVELS[(t.evidence||{}).implement]??0)>=2).length;
  const f=(label,value,formula)=>`<div class="kv"><span class="k">${label}</span><span class="mono">${value}</span></div><p class="sub" style="color:var(--faint);margin:-.3rem 0 .5rem">${formula}</p>`;
  return `<div class="grid g2">
  <div class="card"><div class="plan-col-head"><h3>📊 Evidence</h3></div>
    ${f("Study time by stage",byStage.filter(s=>s.secs>0).map(s=>`${s.name.split(" ")[0]}: ${fmtP(s.secs)}`).join(" · ")||"No data","Σ totalStudySeconds per topic, grouped by roadmap stage")}

    ${f("Reviews completed",revDone,"count of quantumReviews")}
    ${f("Experiments completed",xpDone,"status ∈ completed/analyzed/documented/reproduced")}
    ${f("Projects completed",projDone,"status = completed")}
    ${f("Papers read & critiqued",papersRead,"quantum papers with readingStage ≥ annotated")}
  </div>
  <div class="card"><div class="plan-col-head"><h3>🔍 Diagnosis</h3></div>
    ${f("Confidence vs evidence mismatch",mismatched.length?mismatched.slice(0,5).map(t=>t.title).join("; "):"none","confidence ≥4 but evidence avg <2 with ≥1 dimension tested")}
    ${f("Most neglected important topic",neglected?neglected.title:"none","importance ≥4, not demonstrated, oldest lastStudiedAt")}
    ${f("Prerequisite bottlenecks",bottlenecks.length?bottlenecks.map(t=>`${t.title} (needs ${qMissingPrereqs(t).map(m=>m.title).join(", ")})`).join("; "):"none","learning/practicing topics with undemonstrated prerequisites")}
    ${f("Theory vs implementation",`${theory} theory-evidenced · ${impl} implementation-evidenced`,"topics with explain/derive ≥ adequate vs implement ≥ adequate")}
    <div class="kv"><span class="k">Error categories</span><span class="mono">${topErr.length?"":"No data"}</span></div>
    ${topErr.map(([c,n])=>`<div class="kv"><span class="k" style="padding-left:1rem">${Q_ERROR_LABELS[c]}</span><span class="mono">×${n}</span></div>`).join("")}
    <p class="sub" style="color:var(--faint)">frequency across exercise attempts</p>
  </div></div>
  <div class="card" style="margin-top:1rem"><div class="plan-col-head"><h3>✅ Research readiness checklist</h3><span class="sub">objective evidence only — each item links to it</span></div>
    ${qReadinessHTML()}

}
function qReadinessHTML(){

      S.quantumExercises.some(e=>e.type==="circuit-construction"&&e.status==="solved"),"solved circuit-construction exercise"],
    ["Can explain measurement and entanglement",
      ["demonstrated","mastered"].includes(topicLevel("Measurement"))&&["demonstrated","mastered"].includes(topicLevel("Entanglement")),"Measurement + Entanglement topics demonstrated"],
    ["Can use Qiskit simulation",
      S.quantumSkills.some(s=>/simulat/i.test(s.title)&&["demonstrated","proficient"].includes(s.level))||hasExpWith(e=>e.status==="simulated"||/simulat/i.test(e.simulator||"")),"skill or simulated experiment"],
