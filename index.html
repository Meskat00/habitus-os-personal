    ["Can run and interpret a hardware experiment",
      hasExpWith(e=>e.backend&&!/simulat/i.test(e.backend)&&["completed","analyzed","documented"].includes(e.status)),"experiment on a real backend"],
    ["Can model or analyze noise",
      ["demonstrated","mastered"].includes(topicLevel("Noise models")),"Noise models topic demonstrated"],
    ["Can implement representative algorithms",
      S.quantumExercises.some(e=>["qiskit-implementation","mini-project"].includes(e.type)&&e.status==="solved"),"solved implementation exercise"],
    ["Can reproduce a paper or tutorial",
      S.quantumExperiments.some(e=>e.status==="reproduced")||S.quantumExercises.some(e=>e.type==="paper-reproduction"&&e.status==="solved"),"reproduced experiment or exercise"],
    ["Can document a reproducible experiment",
      hasExpWith(e=>["documented","reproduced"].includes(e.status)),"documented experiment"],
    ["Can critique quantum-advantage claims",
      S.papers.some(p=>p.quantumCategory&&["critiqued","cited"].includes(p.readingStage)),"paper at critiqued stage or beyond"]];
  return items.map(([label,ok,ev])=>`
    <div class="kv"><span class="k">${ok?"✅":"○"} ${label}</span><span class="sub">${ok?ev:"no evidence yet"}</span></div>`).join("");

  "q-inbox-done":(el,ds)=>{Repos.remove("quantumReviews",ds.v,"q-inbox-done");QuantumWorkspace.render();toast("Triaged ✓");},
  "q-inbox-convert":(el,ds)=>{const r=S.quantumReviews.find(x=>x.id===ds.v);if(!r)return;const k=ds.k,text=r.text||"";
    if(k==="topic")qTopicModal({title:text});
    else if(k==="note")qNoteModal({kind:"topic",title:"Note: "+text});
    else if(k==="exercise")qExerciseModal({title:text});
    else if(k==="task"){go("tasks");setTimeout(()=>taskModal({title:text}),150);}
    Repos.remove("quantumReviews",ds.v,"q-inbox-convert");},
  "q-reviewday":(el,ds)=>{const d=+ds.v,arr=(S.quantum.reviewDays||[]).slice();
    const i=arr.indexOf(d);if(i>=0)arr.splice(i,1);else arr.push(d);
    commit("q-reviewday",()=>{S.quantum.reviewDays=arr.sort();});
    const on=arr.includes(d);el.classList.toggle("sel",on);el.setAttribute("aria-pressed",String(on));},
  "q-resource-from-template":(el,ds)=>{const[t,kind,url,note]=Q_RESOURCE_TEMPLATES[+ds.v];
    Repos.add("resources",{title:t,kind:kind==="course"?"reading":kind,url:url||"",status:"to-do",rating:0,
      notes:note,quantum:true,quantumStage:null,progress:0,topicId:null},"q-resource-template");
    toast("Resource added — link it to a stage");QuantumWorkspace.render();},
};
function qCompareModal(x){
  /* compare runs of similar experiments: ideal vs noisy vs hardware */
  const related=S.quantumExperiments.filter(e=>e.id!==x.id&&e.title!==x.title).slice(0,8);
  const related2=related.filter(e=>(e.linkedTopicIds||[]).some(t=>(x.linkedTopicIds||[]).includes(t)));
  const cands=[x,...related2].slice(0,5);
  openModal("Compare runs",esc(x.title),
    `<div class="table-wrap"><table class="tbl"><thead><tr><th>Run</th><th>Backend</th><th>Shots</th><th>Result summary</th></tr></thead><tbody>
     ${cands.map(e=>`<tr><td>${esc(e.title)}</td><td class="mono">${esc(e.backend||e.simulator||"—")}</td><td class="mono">${e.shotCount||"—"}</td><td><small>${esc((e.resultSummary||"").slice(0,80))}</small></td></tr>`).join("")}
     </tbody></table></div>
     <p class="sub" style="margin-top:.5rem">Values come from saved experiment records — nothing is fabricated. Record ideal, noisy, and hardware runs separately to compare.</p>`,
    ()=>{},"Close","⇄");
}
/* milestone checkbox handling (delegated change) */
document.addEventListener("change",e=>{
  const cb=e.target.closest("[data-qms]");
  if(!cb)return;
  const[pid,idx]=cb.dataset.qms.split(":");
  const p=S.quantumProjects.find(x=>x.id===pid);if(!p||!p.milestones||!p.milestones[+idx])return;
  const ms=p.milestones.slice();ms[+idx]=Object.assign({},ms[+idx],{done:cb.checked});
  Repos.update("quantumProjects",pid,{milestones:ms},"q-milestone");
  toast(cb.checked?"Milestone done ✓":"Milestone reopened");
});
/* quantum paper/reading-stage select filters */
document.addEventListener("change",e=>{
  const s=e.target.closest("[data-qsel]");
  if(!s)return;
  if(s.dataset.qsel==="papercat")qPaperCat=s.value;
  else if(s.dataset.qsel==="paperstage")qPaperStage=s.value;
  QuantumWorkspace.render();
});

/* normalize state additions */
</script>

<script>
/* ================================================================
   LAYER 20 — Cloud synchronization (Firebase Auth + Cloud Firestore)
   ----------------------------------------------------------------
   Classic-script layer. All Firebase access goes through window.__fbApi,
   a small promise bridge installed by the deferred ESM module. When cloud
   is not configured, every method below is a safe no-op: the app runs
   exactly as before, local-only.

   Design (single owner, a few devices):
   - One Firestore document per entity:
       users/{ownerUid}/{collection}/{id}
   - Envelope fields (underscore-prefixed, never collide with app fields):
       _rev (int), _uAt/_cAt (client ms), _dev (device id),
       _del (soft-delete ms|null), _schema (1), _owner (uid)
   - Write-through: Store.commit -> Cloud.noteChange -> debounced diff
     (stable hash per document, sync fields excluded) -> batched writes.
   - Soft delete first (Trash restores); hard delete only on purge.
   - Long-form kinds get explicit conflict detection before overwrite.
   - Active timer claim doc prevents duplicate session finalization.
   - Firestore persistent cache is the offline story; IndexedDB remains
     the local mirror, timer-recovery store and emergency-export source.
================================================================ */
"use strict";
const Cloud={
  enabled:false,ready:false,uid:null,user:null,
  deviceId:null,deviceName:null,trusted:false,
  status:"local",lastSyncAt:null,lastError:null,
  paused:false,syncing:false,_suspended:false,_deb:null,
  meta:{},conflicts:[],listeners:[],peerTimer:null,supersededTimer:false,
  stats:{reads:0,writes:0},
  KIND2COLL:{habits:"habits",tasks:"tasks",goals:"goals",projects:"projects",notes:"notes",
    focusSessions:"focusSessions",timelineBlocks:"plannerBlocks",journalEntries:"journalEntries",
    weeklyReviews:"weeklyReviews",books:"books",topics:"learningTopics",problems:"problems",
    calcRuns:"calculationRuns",papers:"papers",manuscripts:"manuscripts",resources:"resources",
    studioItems:"studioItems",breaks:"breakSessions",presentations:"presentationSessions",
    quantumPaths:"quantumPaths",quantumTopics:"quantumTopics",quantumSkills:"quantumSkills",
    quantumExercises:"quantumExercises",quantumProjects:"quantumProjects",
    quantumExperiments:"quantumExperiments",quantumReviews:"quantumReviews"},
  LONGFORM:["notes","journalEntries","papers","manuscripts","quantumExperiments","problems","studioItems","resources"],
  PREF_SYNC:["theme","motion","clock","quantum","scoreWeights","identity","roles","focusAreas",
    "preferredStudy","deepWorkTarget","studyTarget","waterTarget","showScore","retention","onboarded"],
  SYNC_EXCLUDE:["_rev","_uAt","_cAt","_dev","_del","_schema","_owner","_noSync","createdAt","updatedAt"],

  get api(){return window.__fbApi||null;},
  docKey(kind,id){return kind+":"+id;},

  /* ---------- setup (called by the auth module after owner verification) ---------- */
  async setup(opts){
    this.uid=opts.uid;this.user=opts.user;this.trusted=!!opts.trusted;
    this.deviceId=localStorage.getItem("habitus-device-id")||uid();
    localStorage.setItem("habitus-device-id",this.deviceId);
    this.deviceName=localStorage.getItem("habitus-device-name")||Cloud.defaultDeviceName();
    try{this.meta=JSON.parse(localStorage.getItem("habitus-sync-meta")||"{}");}catch(e){this.meta={};}
    this.enabled=true;
    try{
      await this.api.setOne("devices",this.deviceId,{name:this.deviceName,firstSeen:Date.now(),
        lastSeen:Date.now(),appVersion:BUILD,trusted:this.trusted,_uAt:Date.now(),_rev:1,_schema:1,_owner:this.uid});
    }catch(e){Diag.log("cloud","device register failed",e.message);}
    this.setStatus(navigator.onLine?"syncing":"offline");
    Diag.log("cloud","setup ok",this.deviceName+" trusted="+this.trusted);
  },
  defaultDeviceName(){
    try{return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?"Phone":"Computer";}
    catch(e){return "Device";}
  },
  saveMeta(){try{localStorage.setItem("habitus-sync-meta",JSON.stringify(this.meta));}catch(e){}},

  /* ---------- status ---------- */
  setStatus(s,err){
    this.status=s;this.lastError=err||null;
    const pill=document.getElementById("syncPill");
    const map={local:["●","Local","var(--faint)"],synced:["●","Synced","var(--good)"],
      syncing:["◌","Syncing","var(--accent2)"],pending:["◌","Pending","var(--warn)"],
      offline:["■","Offline","var(--warn)"],failed:["⚠","Failed","var(--bad)"]};
    const m=map[s]||map.local;
    if(pill){pill.innerHTML=`<span style="color:${m[2]}">${m[0]}</span> ${m[1]}`;
      pill.title="Sync: "+m[1]+(err?" — "+err:"")+" (Settings → Synchronization)";}
    const sb=document.getElementById("syncStatusBig");
    if(sb)sb.innerHTML=`<span style="color:${m[2]}">${m[0]}</span> <b>${m[1]}</b>`+(err?` <span class="sub">${esc(err)}</span>`:"");
  },

  /* ---------- hashing / envelope ---------- */
  stable(o){
    if(o===null||typeof o!=="object")return JSON.stringify(o);
    if(Array.isArray(o))return "["+o.map(x=>this.stable(x)).join(",")+"]";
    return "{"+Object.keys(o).filter(k=>this.SYNC_EXCLUDE.indexOf(k)<0).sort()
      .map(k=>JSON.stringify(k)+":"+this.stable(o[k])).join(",")+"}";
  },
  hashDoc(d){try{return this.stable(d);}catch(e){return String(Math.random());}},
  stripSync(d){
    const o={};for(const k of Object.keys(d||{}))if(this.SYNC_EXCLUDE.indexOf(k)<0)o[k]=d[k];return o;
  },
  envelope(doc,prevRev,softDelete){
    const now=Date.now();
    const data=Object.assign({},this.stripSync(doc));
    data._owner=this.uid;data._schema=1;
    data._rev=(prevRev||0)+1;data._uAt=now;data._dev=this.deviceId;
    data._cAt=(doc&&doc._cAt)||now;
    data._del=softDelete?now:null;
    data.updatedAt=this.api.serverTs();
    if(!data.createdAt)data.createdAt=this.api.serverTs();
    return data;
  },

  /* ---------- write-through ---------- */
  noteChange(){
    if(!this.enabled||!this.ready||this.paused||this._suspended||!this.api)return;
    this.setStatus("pending");
    clearTimeout(this._deb);
    this._deb=setTimeout(()=>{this.syncDirty().catch(e=>{this.setStatus("failed",e.message);Diag.log("cloud","syncDirty",e.message);});},2500);
  },
  async syncDirty(){
    if(!this.enabled||!this.api||!this.ready||this.paused||this._suspended||this.syncing)return;
    if(!navigator.onLine){this.setStatus("offline");return;}
    this.syncing=true;this.setStatus("syncing");
    try{
      const ops=[]; // {coll,id,data|null(hard delete)}
      for(const kind of Object.keys(this.KIND2COLL)){
        const arr=S[kind]||[],seen=new Set();
        for(const d of arr){
          if(!d||!d.id||d._noSync)continue;seen.add(d.id);
          const key=this.docKey(kind,d.id),h=this.hashDoc(d),m=this.meta[key];
          if(m&&m.deleted){ops.push({kind,id:d.id,doc:d,restore:true});}
          else if(!m||m.hash!==h){ops.push({kind,id:d.id,doc:d});}
        }
        for(const key of Object.keys(this.meta)){
          if(key.indexOf(kind+":")!==0)continue;
          const id=key.slice(kind.length+1);
          if(seen.has(id)||this.meta[key].deleted)continue;
          if(!this.meta[key].hash)continue; // never synced: ignore
          const t=(S.trash||[]).find(x=>x&&x.kind===kind&&x.item&&x.item.id===id);
          if(t)ops.push({kind,id,doc:null,softDelete:true});
          else ops.push({kind,id,doc:null,hardDelete:true});
        }
      }
      // settings doc
      const prefs={};for(const k of this.PREF_SYNC)prefs[k]=S[k];
      const ph=this.stable(prefs);
      if(this.meta["profile:settings"]!==ph)ops.push({settings:true,prefs});
      if(!ops.length){this.setStatus("synced");return;}
      // conflict pre-check for long-form updates (not first uploads)
      const checked=await this.conflictPrecheck(ops.filter(o=>o.doc&&this.LONGFORM.indexOf(o.kind)>=0&&this.meta[this.docKey(o.kind,o.id)]));
      const skipped=new Set(checked.map(c=>c.kind+":"+c.id));
      const batchable=ops.filter(o=>!skipped.has((o.kind||"")+":"+(o.id||"")));
      const items=[];
      for(const o of batchable){
        if(o.settings){items.push({coll:"profile",id:"settings",
          data:Object.assign({prefs:o.prefs,_uAt:Date.now(),_rev:(this.meta["profile:settings:rev"]||0)+1,_schema:1,_owner:this.uid},
            {updatedAt:this.api.serverTs()})});continue;}
        const coll=this.KIND2COLL[o.kind],key=this.docKey(o.kind,o.id),m=this.meta[key]||{};
        if(o.hardDelete){items.push({coll,id:o.id,del:true});continue;}
        const data=this.envelope(o.doc,m.rev,o.softDelete);
        items.push({coll,id:o.id,data});
        o._newRev=data._rev;o._key=key;o._soft=!!o.softDelete;
      }
      // split deletes (hard) from sets: deletes go one-by-one
      const sets=items.filter(i=>!i.del),dels=items.filter(i=>i.del);
      if(sets.length)await this.api.batchSet(sets);
      for(const d of dels)await this.api.delOne(d.coll,d.id);
      this.stats.writes+=sets.length+dels.length;
      for(const o of batchable){
        if(o.settings){this.meta["profile:settings"]=ph;this.meta["profile:settings:rev"]=(this.meta["profile:settings:rev"]||0)+1;continue;}
        if(o.hardDelete){delete this.meta[o._key||this.docKey(o.kind,o.id)];continue;}
        const d=(S[o.kind]||[]).find(x=>x&&x.id===o.id);
        if(d&&o._newRev){d._rev=o._newRev;d._uAt=Date.now();d._dev=this.deviceId;if(o._soft)d._del=Date.now();}
        this.meta[o._key]={rev:o._newRev,hash:this.hashDoc(d||{}),deleted:!!o._soft};
      }
      this.saveMeta();
      this.lastSyncAt=Date.now();
      this.setStatus("synced");
      if(window.Regions&&Regions.syncPanel)Regions.syncPanel();
    }finally{this.syncing=false;}
  },
  async conflictPrecheck(ops){
    const out=[];
    await Promise.all(ops.map(async o=>{
      try{
        const key=this.docKey(o.kind,o.id),m=this.meta[key]||{};
        const rem=await this.api.getOne(this.KIND2COLL[o.kind],o.id);this.stats.reads++;
        if(rem&&rem.data&&(rem.data._rev||0)>(m.rev||0)){
          const remoteContent=this.hashDoc(this.stripSync(rem.data));
          if(remoteContent!==this.hashDoc(o.doc)){
            this.queueConflict(o.kind,o.id,o.doc,rem.data);out.push(o);
          }
        }
      }catch(e){Diag.log("cloud","conflict precheck",e.message);}
    }));
    return out;
  },
  queueConflict(kind,id,local,remote){
    if(this.conflicts.some(c=>c.kind===kind&&c.id===id))return;
    this.conflicts.push({kind,id,local:JSON.parse(JSON.stringify(local)),
      remote:JSON.parse(JSON.stringify(this.stripSync(remote))),at:Date.now()});
    this.showConflict(this.conflicts[this.conflicts.length-1]);
  },

  /* ---------- download / merge ---------- */
  async downloadAll(){
    if(!this.enabled||!this.api)return{local:0,cloud:0};
    let cloud=0;
    this._suspended=true;
    try{
      for(const kind of Object.keys(this.KIND2COLL)){
        const coll=this.KIND2COLL[kind];
        const remotes=await this.api.getAll(coll);this.stats.reads++;
        cloud+=remotes.length;
        this.mergeKind(kind,remotes);
      }
      try{
        const sdoc=await this.api.getOne("profile","settings");this.stats.reads++;
        if(sdoc&&sdoc.data&&sdoc.data.prefs){
          const rp=sdoc.data._rev||0,lp=this.meta["profile:settings:rev"]||0;
          if(rp>lp){for(const k of this.PREF_SYNC)if(sdoc.data.prefs[k]!==undefined)S[k]=sdoc.data.prefs[k];
            this.meta["profile:settings"]=this.stable(sdoc.data.prefs);this.meta["profile:settings:rev"]=rp;}
        }
      }catch(e){Diag.log("cloud","settings download",e.message);}
    }finally{this._suspended=false;}
    this.saveMeta();Persist.soon();
    return{cloud};
  },
  mergeKind(kind,remotes){
    if(!Array.isArray(S[kind]))S[kind]=[];
    for(const r of remotes){
      const d=r.data||{},key=this.docKey(kind,r.id);
      const clean=this.stripSync(d);
      const idx=(S[kind]||[]).findIndex(x=>x&&x.id===r.id);
      if(d._del){
        if(idx>=0)S[kind].splice(idx,1);
        if(!(S.trash||[]).some(t=>t&&t.item&&t.item.id===r.id&&t.kind===kind)){
          if(!Array.isArray(S.trash))S.trash=[];
          S.trash.push({tid:"cloud-"+r.id,kind,item:clean,deletedAt:d._del});
        }
        this.meta[key]={rev:d._rev||1,hash:this.hashDoc(clean),deleted:true};
        continue;
      }
      if(idx<0){
        S[kind].push(clean);
        this.meta[key]={rev:d._rev||1,hash:this.hashDoc(clean)};
      }else{
        const m=this.meta[key]||{rev:0,hash:""};
        if((d._rev||0)>(m.rev||0)){
          const localHash=this.hashDoc(S[kind][idx]);
          if(localHash!==m.hash&&this.LONGFORM.indexOf(kind)>=0){
            this.queueConflict(kind,r.id,S[kind][idx],d);
          }else{
            S[kind][idx]=clean;
            this.meta[key]={rev:d._rev||1,hash:this.hashDoc(clean)};
          }
        }
      }
    }
  },

  /* ---------- first-run migration ---------- */
  localCount(){let n=0;for(const k of Object.keys(this.KIND2COLL))n+=((S[k]||[]).length);return n;},
  async cloudCount(){
    let n=0;const per={};
    for(const kind of Object.keys(this.KIND2COLL)){
      try{const r=await this.api.getAll(this.KIND2COLL[kind]);this.stats.reads++;per[kind]=r.length;n+=r.length;}
      catch(e){per[kind]="err";}
    }
    return{n,per};
  },
  async firstSync(){
    const local=this.localCount();
    this.setStatus("syncing");
    let cc={n:0,per:{}};
    try{cc=await this.cloudCount();}catch(e){this.setStatus("failed","Cannot reach Firestore: "+e.message);return;}
    const done=()=>{localStorage.setItem("habitus-cloud-init","1");};
    const finish=async(msg)=>{
      done();this.ready=true;
      await this.downloadAll().catch(()=>{});
      this.subscribeCore();
      this.noteChange();
      this.setStatus("synced");
      render();
      if(msg)toast(msg);
    };
    const rec=cc.n===0?"upload":(local===0?"download":"merge");
    const recText={upload:"Upload this device as the initial cloud copy",
      download:"Download the cloud copy to this device",
      merge:"Merge local and cloud (newer revision wins; long notes ask you)"}[rec];
    const body=`
      <div class="kv"><span class="k">Local records</span><span class="mono"><b>${local}</b></span></div>
      <div class="kv"><span class="k">Cloud records</span><span class="mono"><b>${cc.n}</b></span></div>
      <p class="sub" style="margin:.6rem 0">Recommended: <b>${recText}</b></p>
      <p class="hint">A pre-sync snapshot is taken before any upload. Nothing is deleted either side without your choice.</p>`;
    openModal("Sync setup","First connection for this owner.",body,async v=>{
      const choice=v.choice;
      if(choice==="export"){exportData("habitus-pre-sync-backup-"+dayKey()+".json");return;}
      if(choice==="cancel"){this.setStatus("local");return;}
      const snapId=await Snapshots.take("pre-sync").catch(()=>null);
      if(choice==="upload"){
        this.ready=true; // allow noteChange path during upload? no — direct:
        await this.uploadAll();
        const verify=await this.cloudCount();
        await finish(`Cloud copy created ✓ (${verify.n} records)${snapId?" · pre-sync snapshot kept":""}`);
      }else if(choice==="download"){
        await this.downloadAll();
        await finish(`Cloud copy downloaded ✓ (${cc.n} records)`);
      }else{ // merge
        await this.downloadAll();
        this.ready=true;
        await this.syncDirty();
        await finish("Merged ✓ — newer revisions kept, conflicts flagged");
      }
    },"Continue →","☁");
    // inject choice radios into the modal
    const mr=document.querySelector("#modalRoot");
    if(mr){
      const form=mr.querySelector("form");
      if(form){
        const div=document.createElement("div");
        div.innerHTML=`<div class="f" style="margin:.4rem 0 .2rem">Action</div>
          <label class="checkline"><input type="radio" name="choice" value="${rec}" checked/> ${recText} (recommended)</label>
          ${rec!=="upload"?`<label class="checkline"><input type="radio" name="choice" value="upload"/> Upload this device as the initial cloud copy</label>`:""}
          ${rec!=="download"?`<label class="checkline"><input type="radio" name="choice" value="download"/> Replace local from cloud</label>`:""}
          ${rec!=="merge"?`<label class="checkline"><input type="radio" name="choice" value="merge"/> Merge local and cloud</label>`:""}
          <label class="checkline"><input type="radio" name="choice" value="export"/> Export a backup first</label>
          <label class="checkline"><input type="radio" name="choice" value="cancel"/> Cancel (stay local for now)</label>`;
        form.insertBefore(div,form.querySelector(".modal-actions")||null);
      }
    }
  },
  async uploadAll(){
    if(!this.enabled||!this.api)return;
    this._suspended=true;
    try{
      for(const kind of Object.keys(this.KIND2COLL)){
        const coll=this.KIND2COLL[kind],items=[];
        for(const d of (S[kind]||[])){
          if(!d||!d.id||d._noSync)continue;
          const key=this.docKey(kind,d.id);
          const data=this.envelope(d,0,false);
          items.push({coll,id:d.id,data});
          d._rev=1;d._uAt=Date.now();d._dev=this.deviceId;
          this.meta[key]={rev:1,hash:this.hashDoc(d)};
        }
        if(items.length){await this.api.batchSet(items);this.stats.writes+=items.length;}
      }
      const prefs={};for(const k of this.PREF_SYNC)prefs[k]=S[k];
      await this.api.setOne("profile","settings",{prefs,_uAt:Date.now(),_rev:1,_schema:1,_owner:this.uid,updatedAt:this.api.serverTs()});
      this.meta["profile:settings"]=this.stable(prefs);this.meta["profile:settings:rev"]=1;
      this.saveMeta();this.lastSyncAt=Date.now();
    }finally{this._suspended=false;}
  },
  async afterLocalBoot(){
    if(!this.enabled||!this.api)return;
    if(localStorage.getItem("habitus-cloud-init")==="1"){
      this.ready=true;
      this.setStatus("syncing");
      try{
        await this.downloadAll();
        this.subscribeCore();
        this.setStatus("synced");
        this.noteChange(); // upload anything changed while away
      }catch(e){this.setStatus("failed",e.message);Diag.log("cloud","afterLocalBoot",e.message);}
    }else{
      await this.firstSync();
    }
  },

  /* ---------- listeners (targeted, not whole-database) ---------- */
  subscribeCore(){
    if(!this.api||this.paused)return;
    this.unsubscribeAll();
    const W=(f,op,v)=>({f,op,v});
    const subs=[
      ["tasks",[W("_del","==",null)],(docs)=>this.applyRemote("tasks",docs)],
      ["habits",[W("_del","==",null)],(docs)=>this.applyRemote("habits",docs)],
      ["plannerBlocks",[W("_del","==",null)],(docs)=>this.applyRemote("timelineBlocks",docs)],
      ["focusSessions",[W("_del","==",null)],(docs)=>this.applyRemote("focusSessions",docs)],
      ["notes",[W("_del","==",null)],(docs)=>this.applyRemote("notes",docs)],
      ["quantumTopics",[W("_del","==",null)],(docs)=>this.applyRemote("quantumTopics",docs)],
      ["quantumReviews",[W("_del","==",null)],(docs)=>this.applyRemote("quantumReviews",docs)],
      ["journalEntries",[W("_del","==",null)],(docs)=>this.applyRemote("journalEntries",docs)],
    ];
    for(const [coll,filters,cb] of subs){
      try{this.listeners.push(this.api.listenColl(coll,filters,(docs,err)=>{
        if(err){Diag.log("cloud","listener "+coll,err.message);return;}
        if(docs)cb(docs);
      }));}catch(e){Diag.log("cloud","subscribe "+coll,e.message);}
    }
    // active-timer claim (cross-device timer safety)
    try{this.listeners.push(this.api.listenDoc("syncMetadata","activeTimer",(doc,err)=>{
      if(err||!doc)return;this.onPeerTimer(doc.data);
    }));}catch(e){}
    Diag.log("cloud","subscribed",this.listeners.length+" listeners");
  },
  unsubscribeAll(){for(const u of this.listeners){try{u();}catch(e){}}this.listeners=[];},
  applyRemote(kind,docs){
    if(!this.ready||this._suspended||this.paused)return;
    this._suspended=true;
    try{this.mergeKind(kind,docs||[]);}finally{this._suspended=false;}
    Persist.soon();
    if(typeof render==="function"){try{render();}catch(e){}}
  },

  /* ---------- active timer claim ---------- */
  async claimTimer(info){
    if(!this.enabled||!this.api)return;
    try{await this.api.setOne("syncMetadata","activeTimer",Object.assign(
      {deviceId:this.deviceId,deviceName:this.deviceName,startedAt:Date.now(),updatedAt:Date.now(),
       _uAt:Date.now(),_rev:1,_schema:1,_owner:this.uid},info||{}));}catch(e){}
  },
  async releaseTimer(){
    if(!this.enabled||!this.api)return;
    try{await this.api.delOne("syncMetadata","activeTimer");}catch(e){}
    this.supersededTimer=false;
  },
  onPeerTimer(data){
    if(!data||data.deviceId===this.deviceId){this.hidePeerBanner();return;}
    const age=Date.now()-(data.updatedAt||data.startedAt||0);
    if(age>3*3600*1000){this.hidePeerBanner();return;} // stale claim
    if(data.takeoverBy&&data.takeoverBy!==this.deviceId&&data.deviceId===this.deviceId){
      // my claim was taken over elsewhere
      this.supersededTimer=true;
      toast(`Timer taken over on ${data.takeoverName||"another device"} — this device won't upload the session`);
      this.hidePeerBanner();return;
    }
    if(data.deviceId!==this.deviceId&&!data.takeoverBy){
      this.peerTimer=data;this.showPeerBanner(data);
    }else this.hidePeerBanner();
  },
  showPeerBanner(d){
    let b=document.getElementById("peerBanner");
    if(!b){b=document.createElement("div");b.id="peerBanner";b.setAttribute("role","alert");
      document.body.prepend(b);}
    b.innerHTML=`<span>⏱ This session is active on <b>${esc(d.deviceName||"another device")}</b>${d.label?` — ${esc(d.label)}`:""}</span>
      <span style="display:flex;gap:.4rem">
      <button class="btn btn-sm" data-action="cloud-timer-takeover">Take over on this device</button>
      <button class="btn btn-sm btn-ghost" data-action="cloud-timer-dismiss">Dismiss</button></span>`;
  },
  hidePeerBanner(){const b=document.getElementById("peerBanner");if(b)b.remove();this.peerTimer=null;},
  async takeoverTimer(){
    if(!this.peerTimer||!this.api)return;
    await this.api.setOne("syncMetadata","activeTimer",{deviceId:this.deviceId,deviceName:this.deviceName,
      startedAt:Date.now(),updatedAt:Date.now(),takeoverBy:this.deviceId,takeoverName:this.deviceName,
      label:this.peerTimer.label||"",kind:this.peerTimer.kind||"focus",
      _uAt:Date.now(),_rev:(this.peerTimer._rev||1)+1,_schema:1,_owner:this.uid});
    this.hidePeerBanner();toast("Timer taken over on this device");
  },

  /* ---------- conflicts UI ---------- */
  showConflict(c){
    const keys=[...new Set([...Object.keys(c.local),...Object.keys(c.remote)])]
      .filter(k=>this.SYNC_EXCLUDE.indexOf(k)<0&&JSON.stringify(c.local[k])!==JSON.stringify(c.remote[k]));
    const row=(side,o)=>`<div><p class="sub">${side} · ${new Date(o._uAt||c.at).toLocaleString()}</p>
      ${keys.slice(0,6).map(k=>`<div class="kv"><span class="k">${esc(k)}</span><span class="sub">${esc(String(o[k]??"").slice(0,120))}</span></div>`).join("")||'<p class="sub">No field differences captured.</p>'}</div>`;
    openModal("Sync conflict","A newer version exists on another device.",
      `<p class="sub" style="margin-bottom:.5rem">${esc(c.kind)} · changed fields: ${keys.map(esc).join(", ")||"—"}</p>
       <div class="grid g2">${row("This device",c.local)}${row("Cloud version",c.remote)}</div>`,
      v=>{
        const how=v.how;
        this._suspended=true;
        try{
          const arr=S[c.kind]||[],idx=arr.findIndex(x=>x&&x.id===c.id);
          if(how==="mine"){
            const key=this.docKey(c.kind,c.id);
            this.meta[key]={rev:(c.remote._rev||0)+1,hash:"!dirty"};
            this.noteChange();
          }else if(how==="cloud"){
            if(idx>=0)arr[idx]=Object.assign({},c.remote);
            this.meta[this.docKey(c.kind,c.id)]={rev:c.remote._rev||1,hash:this.hashDoc(c.remote)};
            Persist.soon();render();
          }else if(how==="both"){
            const copy=Object.assign({},c.local,{id:uid()+"-b",_rev:0});
            arr.push(copy);
            if(idx>=0)arr[idx]=Object.assign({},c.remote);
            delete this.meta[this.docKey(c.kind,c.id)];
            this.noteChange();Persist.soon();render();
          }
        }finally{this._suspended=false;}
        this.conflicts=this.conflicts.filter(x=>x!==c);
        toast("Conflict resolved ✓");
      },"Resolve →","⚠");
    const mr=document.querySelector("#modalRoot form");
    if(mr){
      const div=document.createElement("div");
      div.innerHTML=`<div class="f" style="margin:.4rem 0 .2rem">Resolution</div>
        <label class="checkline"><input type="radio" name="how" value="mine" checked/> Keep this version</label>
        <label class="checkline"><input type="radio" name="how" value="cloud"/> Keep cloud version</label>
        <label class="checkline"><input type="radio" name="how" value="both"/> Preserve both</label>`;
      mr.insertBefore(div,mr.querySelector(".modal-actions")||null);
    }
  },

  /* ---------- manual ops ---------- */
  async syncNow(){
    if(!this.enabled||!this.api){toast("Cloud not configured");return;}
    this.setStatus("syncing");
    try{await this.syncDirty();await this.downloadAll();this.lastSyncAt=Date.now();this.setStatus("synced");toast("Synced ✓");}
    catch(e){this.setStatus("failed",e.message);toast("Sync failed: "+e.message);}
    if(window.Regions&&Regions.syncPanel)Regions.syncPanel();
  },
  pause(){this.paused=true;this.unsubscribeAll();this.setStatus("local");},
  resume(){this.paused=false;this.subscribeCore();this.noteChange();},
  counts(){
    const local={};for(const k of Object.keys(this.KIND2COLL))local[k]=(S[k]||[]).length;
    return{local};
  },

  /* ---------- sign out ---------- */
  async signOut(removeLocal){
    if(this.api){
      try{
        // best-effort flush; persistent queue survives restart anyway
        await this.syncDirty().catch(()=>{});
      }catch(e){}
    }
    const pending=this.pendingOps();
    if(pending>0&&!removeLocal){
      const ok=await this.confirmAsync(`There are ${pending} unsynchronized change(s). Sign out anyway? They will sync next time on a trusted device.`);
      if(!ok)return false;
    }
    if(removeLocal){
      const ok=await this.confirmAsync("Remove ALL Habitus data from this device? This cannot be undone on this device (cloud copy is untouched).");
      if(!ok)return false;
    }
    this.unsubscribeAll();this.hidePeerBanner();
    try{if(this.api)await this.api.signOut();}catch(e){}
    // clear sensitive in-memory state
    for(const k of Object.keys(S))delete S[k];
    Object.assign(S,normalizeState(seedState()));
    this.enabled=false;this.ready=false;this.uid=null;this.user=null;this.meta={};this.conflicts=[];
    this.saveMeta();
    if(removeLocal){
      try{
        try{if(window.indexedDB&&window.DB)indexedDB.deleteDatabase(DB.NAME);}catch(e){}
        if(window.DB)DB.available=false;
        for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);
          if(k&&k.indexOf("habitus")===0&&k!=="habitus-device-id"&&k!=="habitus-device-name")localStorage.removeItem(k);}
        localStorage.removeItem("habitus-cloud-init");
        localStorage.removeItem("habitus-sync-meta");
        localStorage.removeItem("habitus-trusted-device");
      }catch(e){}
    }
    try{if(document.exitFullscreen&&document.fullscreenElement)await document.exitFullscreen();}catch(e){}
    location.reload();
    return true;
  },
  pendingOps(){
    let n=0;
    for(const kind of Object.keys(this.KIND2COLL)){
      for(const d of (S[kind]||[])){if(!d||!d.id)continue;
        const m=this.meta[this.docKey(kind,d.id)];
        if(!m||m.hash!==this.hashDoc(d))n++;}
    }
    return n;
  },
  confirmAsync(msg){
    return new Promise(res=>{
      openModal("Confirm",msg,"",v=>res(true),"OK","⚠");
      const mr=document.querySelector("#modalRoot");
      const obs=new MutationObserver(()=>{if(!document.querySelector("#modalRoot form")){obs.disconnect();res(false);}});
      if(mr)obs.observe(mr,{childList:true});
    });
  }
};
/* Expose to window: the ESM auth/cloud bootstrap (deferred module) drives
   setup through window.Cloud. Top-level const does not land on window. */
window.Cloud=Cloud;

</script>

<script type="module">
/* ================================================================
   Habitus OS — Cloud bootstrap (ESM).
   Deferred by default: runs after every classic layer is parsed.
   Owns: Firebase init, auth flow, owner gate, Firestore init
   (persistent cache on trusted devices), and the window.__fbApi
   bridge consumed by the classic Cloud layer (LAYER 20).
   If the module or the network fails, the classic fallback timer
   boots the app locally — the app never hard-depends on cloud.
================================================================ */
import { initializeApp } from "firebase/app";
import {
  getAuth, onAuthStateChanged, GoogleAuthProvider,
  signInWithPopup, signInWithEmailAndPassword, signOut as fbSignOut
} from "firebase/auth";
import {
  getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, getDoc, getDocs, setDoc, deleteDoc, writeBatch,
  onSnapshot, query, where, serverTimestamp
} from "firebase/firestore";

const VER = window.FIREBASE_SDK_VERSION || "10.12.2";
const cfg = window.FIREBASE_CONFIG || {};
let OWNER_UID = window.OWNER_UID || "";
/* Owner UID lives in owner.json (repo root) so access can be granted without
   re-uploading this file. Fetched fresh (no-store) at boot; inline
   window.OWNER_UID above still wins when set. */
async function resolveOwnerUid(){
  if(OWNER_UID) return OWNER_UID;
  try{
    const r=await fetch("owner.json",{cache:"no-store"});
    if(r.ok){ const j=await r.json(); if(j&&j.uid) OWNER_UID=String(j.uid); }
  }catch(e){}
  return OWNER_UID;
}
const appShell = () => document.getElementById("appShell");
const authShell = () => document.getElementById("authShell");

function started(){ window.__habitusStarted = true; }
function showApp(){ const a=authShell(), s=appShell(); if(a)a.hidden=true; if(s)s.hidden=false; }
function showAuth(forms){
  const a=authShell(), s=appShell(); if(s)s.hidden=true; if(a)a.hidden=false;
  const l=document.getElementById("authLoading"), f=document.getElementById("authForms");
  if(l)l.hidden=!!forms; if(f)f.hidden=!forms;
}
function authError(msg, allowLocal){
  showAuth(true);
  const e=document.getElementById("authErr");
  if(e){ e.hidden=false; e.textContent=msg; }
  if(allowLocal){
    let b=document.getElementById("authLocalBtn");
    if(!b){
      b=document.createElement("button");
      b.id="authLocalBtn"; b.className="btn auth-btn"; b.textContent="Continue locally (no sync)";
      b.onclick=()=>{ started(); showApp(); window.HabitusBoot(); };
      document.getElementById("authForms").appendChild(b);
    }
  }
}
function clearError(){ const e=document.getElementById("authErr"); if(e){e.hidden=true;e.textContent="";} }

/* Trusted-device choice. Stored per browser: habitus-trusted-device = "1"|"0". */
function ensureTrustedDevice(){
  return new Promise((resolve)=>{
    try{
      const v=localStorage.getItem("habitus-trusted-device");
      if(v==="1")return resolve(true);
      if(v==="0")return resolve(false);
    }catch(e){ return resolve(false); }
    const ov=document.createElement("div");
    ov.className="auth-wrap"; ov.style.position="fixed"; ov.style.zIndex="300";
    ov.innerHTML=`<div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="tdT">
      <h2 id="tdT" class="font-display" style="margin-bottom:.4rem">Trusted device?</h2>
      <p class="sub" style="margin-bottom:1rem">Is this your trusted personal device?</p>
      <button class="btn btn-primary auth-btn" id="tdYes">Yes — enable offline storage</button>
      <button class="btn auth-btn" id="tdNo">No — online session only</button>
      <p class="hint">On untrusted devices the app keeps personal data in memory only and never persists the cloud cache.</p>
    </div>`;
    document.body.appendChild(ov);
    const done=(val)=>{ try{localStorage.setItem("habitus-trusted-device",val?"1":"0");}catch(e){} ov.remove(); resolve(val); };
    ov.querySelector("#tdYes").onclick=()=>done(true);
    ov.querySelector("#tdNo").onclick=()=>done(false);
  });
}

function makeApi(auth, db, user){
  const uid=user.uid;
  const P=(coll,id)=>"users/"+uid+"/"+coll+(id?"/"+id:"");
  return {
    uid, serverTimestamp, serverTs: serverTimestamp,
    async batchSet(items){
      for(let i=0;i<items.length;i+=400){
        const b=writeBatch(db);
        for(const it of items.slice(i,i+400)) b.set(doc(db,P(it.coll,it.id)), it.data);
        await b.commit();
      }
    },
    async getAll(coll){
      const snap=await getDocs(collection(db,P(coll)));
      return snap.docs.map(d=>({id:d.id,data:d.data(),meta:d.metadata}));
    },
    async getOne(coll,id){
      const s=await getDoc(doc(db,P(coll,id)));
      return s.exists()?{id:s.id,data:s.data(),meta:s.metadata}:null;
    },
    async setOne(coll,id,data){ await setDoc(doc(db,P(coll,id)),data); },
    async delOne(coll,id){ await deleteDoc(doc(db,P(coll,id))); },
    listenColl(coll,filters,cb){
      let q=collection(db,P(coll));
      if(filters&&filters.length) q=query(q,...filters.map(x=>where(x.f,x.op,x.v)));
      return onSnapshot(q,
        (snap)=>cb(snap.docs.map(d=>({id:d.id,data:d.data(),meta:d.metadata})),null),
        (err)=>cb(null,err));
    },
    listenDoc(coll,id,cb){
      return onSnapshot(doc(db,P(coll,id)),
        (s)=>cb(s.exists()?{id:s.id,data:s.data(),meta:s.metadata}:null,null),
        (err)=>cb(null,err));
    },
    async signOut(){ await fbSignOut(auth); }
  };
}

async function initDb(app, trusted){
  if(trusted){
    try{
      return initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
    }catch(e){
      console.warn("[habitus] persistent cache unavailable, using memory cache:",e);
      try{ window.HabitusCloudCacheWarn="Persistent offline cache unavailable on this browser — using memory cache."; }catch(_){}
    }
  }
  return getFirestore(app);
}

async function main(){
  if(!window.CLOUD_ENABLED){
    /* Local-only build: the classic Layer-21 startup gate already booted
       (module scripts are deferred and run after it). Never boot twice —
       a second boot stacked two onboarding overlays with duplicate IDs,
       leaving the visible Continue button without a handler. */
    if(!window.__habitusStarted){ started(); showApp(); window.HabitusBoot(); }
    return;
  }
  await resolveOwnerUid();
  let app, auth;
  try{
    app=initializeApp(cfg); auth=getAuth(app);
  }catch(e){ authError("Cloud configuration invalid: "+(e&&e.message||e), true); return; }

  const gBtn=document.getElementById("googleSignIn");
  const eTgl=document.getElementById("emailToggle");
  const eForm=document.getElementById("emailForm");
  if(gBtn) gBtn.onclick=async()=>{
    clearError();
    try{ await signInWithPopup(auth,new GoogleAuthProvider()); }
    catch(e){ authError("Sign-in failed. Please try again.", false); }
  };
  if(eTgl&&eForm) eTgl.onclick=()=>{ eForm.hidden=!eForm.hidden; };
  if(eForm) eForm.onsubmit=async(ev)=>{
    ev.preventDefault(); clearError();
    const em=document.getElementById("authEmail").value.trim();
    const pw=document.getElementById("authPass").value;
    try{ await signInWithEmailAndPassword(auth,em,pw); }
    catch(e){ authError("Sign-in failed. Check your credentials and try again.", false); }
  };

  onAuthStateChanged(auth, async(user)=>{
    if(!user){ started(); showAuth(true); return; }
    if(!OWNER_UID||user.uid!==OWNER_UID){
      const signedInUid=user.uid, signedInEmail=user.email||"";
      try{ await fbSignOut(auth); }catch(e){}
      started(); showAuth(true);
      authError(OWNER_UID
        ? "Access denied. This is a private single-owner workspace."
        : "Owner access is not set up yet.", false);
      /* Show the signed-in person their own UID so they can send it to Muse
         to grant access. Displayed only to the person who just signed in. */
      try{
        const e=document.getElementById("authErr");
        if(e){
          const d=document.createElement("div");
          d.style.cssText="margin-top:10px;font-size:12px;line-height:1.6;opacity:.9;word-break:break-all;";
          d.textContent=(signedInEmail?("Signed in as "+signedInEmail+". "):"")
            +"Your UID: "+signedInUid+" — send this UID to Muse to grant owner access.";
          e.appendChild(d);
        }
      }catch(_){}
      try{ window.Cloud&&window.Cloud.setStatus("local"); }catch(e){}
      return;
    }
    showAuth(false); // loading state while we initialize
    const trusted=await ensureTrustedDevice();
    let db;
    try{ db=await initDb(app,trusted); }
    catch(e){ authError("Could not start the database: "+(e&&e.message||e), true); return; }
    window.__fbApi=makeApi(auth,db,user);
    try{
      await window.Cloud.setup({uid:user.uid,user,trusted});
    }catch(e){ authError("Cloud setup failed: "+(e&&e.message||e), true); return; }
    started(); showApp();
    window.HabitusBoot();
  });
}
main().catch((e)=>authError("Startup failed: "+(e&&e.message||e), true));

</script>

<script>

    ${on&&window.HabitusCloudCacheWarn?`<p class="sub" style="color:var(--warn)">${esc(window.HabitusCloudCacheWarn)}</p>`:""}
    ${on&&c.conflicts.length?`<p class="sub" style="color:var(--warn)">⚠ ${c.conflicts.length} conflict(s) need review <button class="btn btn-xs" data-action="cloud-conflicts">Review</button></p>`:""}
    <div class="head-actions" style="margin-top:.8rem;flex-wrap:wrap">

    <p class="hint">Reads/writes are this session's approximate Firestore usage, not official billing totals.</p></div>`;
}
function cloudDeviceHTML(){

  return `<div class="card" id="setAnchor-device" style="margin-top:1rem"><h3>📱 Device</h3>
    <div class="kv"><span class="k">Device name</span><span>${esc((c&&c.deviceName)||"—")} <button class="btn btn-xs btn-ghost" data-action="cloud-device-rename">Rename</button></span></div>
    <div class="kv"><span class="k">Device ID</span><span class="mono sub">${esc(((c&&c.deviceId)||"").slice(0,12))}…</span></div>
    <div class="kv"><span class="k">Trusted device</span><span>${on?(c.trusted?"Yes — offline storage on":"No — memory only"):"—"}</span></div>
    <div class="kv"><span class="k">App version</span><span class="mono">${typeof BUILD!=="undefined"?BUILD:"—"}</span></div>
    <div class="head-actions" style="margin-top:.8rem;flex-wrap:wrap">
      <button class="btn btn-sm" data-action="cloud-trusted-toggle" ${on?"":"disabled"}>${on&&c.trusted?"Make untrusted":"Make trusted"}</button>
      <button class="btn btn-sm btn-danger" data-action="cloud-remove-local">Remove local offline data</button>
    </div>
    <p class="hint">Changing trust restarts the app to reinitialize storage.</p></div>`;
}
function cloudInstallHTML(){
  return `<div class="card" id="setAnchor-install" style="margin-top:1rem"><h3>⬇ Installation</h3>
    <div class="kv"><span class="k">PWA status</span><span id="pwaStatus">Checking…</span></div>
    <div class="kv"><span class="k">Service worker</span><span class="mono" id="swStatus">…</span></div>
    <div class="kv"><span class="k">Cache version</span><span class="mono">habitus-os-v5-1-release-1</span></div>
    <div class="kv"><span class="k">Update</span><span id="swUpdate">Up to date</span></div>
    <div class="head-actions" style="margin-top:.8rem;flex-wrap:wrap">
      <button class="btn btn-sm btn-primary" id="pwaInstallBtn" data-action="cloud-install" hidden>Install app</button>
      <button class="btn btn-sm" data-action="cloud-update-check">Check for updates</button>
    </div>
    <p class="hint">iPhone: Share → Add to Home Screen. Updates never interrupt an active timer — you'll be asked first.</p></div>`;
}
/* PWA: registration + timer-safe update flow */
const PWA={
  reg:null,
  init(){
    if(!("serviceWorker" in navigator))return;
    if(!/^https?:$/.test(location.protocol))return;
    window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.__pwaPrompt=e;
      const b=document.getElementById("pwaInstallBtn");if(b)b.hidden=false;
      const ps=document.getElementById("pwaStatus");if(ps)ps.textContent="Installable";});
    window.addEventListener("appinstalled",()=>{window.__pwaPrompt=null;
      const b=document.getElementById("pwaInstallBtn");if(b)b.hidden=true;
      const ps=document.getElementById("pwaStatus");if(ps)ps.textContent="Installed";});
    if(window.matchMedia&&matchMedia("(display-mode: standalone)").matches){
      const ps=document.getElementById("pwaStatus");if(ps)ps.textContent="Installed (standalone)";}
    navigator.serviceWorker.register(new URL("./sw.js",location.href),{scope:"./"}).then(reg=>{
      this.reg=reg;
      const sw=document.getElementById("swStatus");if(sw)sw.textContent="registered";
      const track=(w)=>{if(!w)return;w.addEventListener("statechange",()=>{
        if(w.state==="installed"&&navigator.serviceWorker.controller)this.onUpdateReady(w);});};
      reg.addEventListener("updatefound",()=>track(reg.installing));
      if(reg.waiting)this.onUpdateReady(reg.waiting);
      setInterval(()=>{reg.update().catch(()=>{});},6*3600*1000);
    }).catch(()=>{const sw=document.getElementById("swStatus");if(sw)sw.textContent="unavailable";});
    let refreshing=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!refreshing){refreshing=true;location.reload();}});
  },
  safeToUpdate(){
    try{
      if(window.FOCUS&&FOCUS.status==="running")return false;
      if(window.FC_SW&&FC_SW.running)return false;
      if(window.FC_PRES&&FC_PRES.running)return false;
      if(window.Cloud&&(Cloud.syncing||Cloud.pendingOps()>0))return false;
      if(document.querySelector("#modalRoot form"))return false;
    }catch(e){}
    return true;
  },
  onUpdateReady(worker){
    const apply=async()=>{
      try{if(window.Cloud)await Cloud.syncDirty().catch(()=>{});}catch(e){}
      try{await Snapshots.take("pre-update");}catch(e){}
      try{if(window.Persist&&Persist.now)await Persist.now();}catch(e){}
      worker.postMessage({type:"HABITUS_SKIP_WAITING"});
    };
    const upd=document.getElementById("swUpdate");
    if(this.safeToUpdate()){
      if(upd)upd.innerHTML="<b>Update available</b>";
      this.showUpdateBar(apply);
    }else{
      if(upd)upd.innerHTML="<b>Update available</b> — applies when timers finish";
      const iv=setInterval(()=>{if(this.safeToUpdate()){clearInterval(iv);this.onUpdateReady(worker);}},15000);
    }
  },
  showUpdateBar(apply){
    if(document.getElementById("updateBar"))return;
    const b=document.createElement("div");
    b.id="updateBar";b.setAttribute("role","alert");
    b.innerHTML=`<span>⬇ A new Habitus OS version is ready.</span>
      <span style="display:flex;gap:.4rem"><button class="btn btn-sm btn-primary" id="updNow">Update now</button>
      <button class="btn btn-sm btn-ghost" id="updLater">Later</button></span>`;
    document.body.prepend(b);
    document.getElementById("updNow").onclick=()=>{b.remove();apply();};
    document.getElementById("updLater").onclick=()=>b.remove();
  },
  checkUpdate(){
    if(this.reg)this.reg.update().then(()=>toast("Checked for updates")).catch(()=>toast("Update check failed"));
    else toast("Service worker not registered");
  }
};
Object.assign(Actions,{
  "goto-sync":()=>{go("settings");setTimeout(()=>{const el=document.getElementById("setAnchor-sync");if(el)el.scrollIntoView({block:"start"});},150);},
  "cloud-sync-now":()=>{if(window.Cloud)Cloud.syncNow();},
  "cloud-pause":()=>{if(window.Cloud){Cloud.pause();render();}},
  "cloud-resume":()=>{if(window.Cloud){Cloud.resume();render();}},
  "cloud-conflicts":()=>{const c=window.Cloud&&Cloud.conflicts[0];if(c)Cloud.showConflict(c);else toast("No conflicts");},
  "cloud-signout":()=>{if(window.Cloud)Cloud.signOut(false);},
  "cloud-signout-wipe":()=>{if(window.Cloud)Cloud.signOut(true);},
  "cloud-trusted-toggle":()=>{const v=!(localStorage.getItem("habitus-trusted-device")==="1");
    try{localStorage.setItem("habitus-trusted-device",v?"1":"0");}catch(e){}
    toast(v?"Trusted — restarting with offline storage":"Untrusted — restarting");setTimeout(()=>location.reload(),700);},
  "cloud-device-rename":()=>{if(!window.Cloud||!Cloud.enabled)return;
    openModal("Device name","Identifies this device for timer handoff.",
      `<label class="f" for="mDName">Name</label><input class="input" id="mDName" name="dname" value="${esc(Cloud.deviceName||"")}" style="margin-top:.3rem"/>`,
      v=>{const nm=String(v.dname||"").trim();if(!nm)return;
        try{localStorage.setItem("habitus-device-name",nm);}catch(e){}
        Cloud.deviceName=nm;if(Cloud.api)Cloud.api.setOne("devices",Cloud.deviceId,{name:nm}).catch(()=>{});
        render();toast("Device renamed");},"Save →","📱");},
  "cloud-remove-local":async()=>{
    if(!window.Cloud)return;
    const ok=await Cloud.confirmAsync("Remove local offline data (IndexedDB + caches) from this device? The cloud copy is untouched. The app will restart.");
    if(!ok)return;
    try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}catch(e){}
    try{if(window.DB&&DB.clearAll)await DB.clearAll();}catch(e){}
    location.reload();},
  "cloud-install":()=>{if(window.__pwaPrompt)window.__pwaPrompt.prompt();else toast("Use your browser's install/share menu");},
  "cloud-update-check":()=>PWA.checkUpdate(),
  "cloud-timer-takeover":()=>{if(window.Cloud)Cloud.takeoverTimer();},
  "cloud-timer-dismiss":()=>{if(window.Cloud)Cloud.hidePeerBanner();}
});
/* update-bar CSS (injected once) */
(function(){
  const st=document.createElement("style");
  st.textContent="#updateBar{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:190;display:flex;gap:.8rem;align-items:center;background:#0d1024;border:1px solid #7c3aed;border-radius:12px;padding:.6rem 1rem;font-size:.88rem;box-shadow:0 12px 40px rgba(0,0,0,.5)}";
  document.head.appendChild(st);
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>PWA.init());
  else PWA.init();
})();

</script>

<script>
"use strict";
/* Boot last: every layer above must be parsed before the app starts. */
Object.assign(Actions,FC_ACTIONS);
Object.assign(Actions,Q_ACTIONS);
Object.assign(Actions,DIAG_ACTIONS);
Object.assign(Actions,{"q-export-portable":()=>qExportPortable()});
/* Public namespace: the single organized surface of the application. */
Object.assign(window.Habitus,{
  version:BUILD,
  store:{state:()=>S,commit:commit,Persist:Persist,Store:Store},
  db:DB,
  router:{go:go,route:()=>route,routeParam:()=>routeParam},
  timer:{engine:TE,startFocusSession:startFocusSession,endFocusSession:endFocusSession,adjust:fcAdjustFocus},
  modules:{QuantumWorkspace:QuantumWorkspace},
  services:{Diag:Diag,notify:notifyUser,a11y:a11yAnnounce},
  ui:{modal:openModal,toast:toast,esc:esc}
});
/* Startup gate: cloud-configured builds wait for the ESM auth module
   (owner sign-in -> Firestore -> boot). Local-only builds and the
   module-failure fallback boot immediately. Exposed for tests. */
window.HabitusBoot=boot;
(function(){
  var appShell=document.getElementById("appShell"),authShell=document.getElementById("authShell");
  window.__habitusLocalFallback=function(){
    if(window.__habitusStarted)return;
    window.__habitusStarted=true;
    if(authShell)authShell.hidden=true;
    if(appShell)appShell.hidden=false;
    try{toast("Cloud unavailable — running locally");}catch(e){}
    boot();
  };
  if(!window.CLOUD_ENABLED){
    window.__habitusStarted=true;
    if(authShell)authShell.hidden=true;
    if(appShell)appShell.hidden=false;
    boot();
    return;
  }
  if(authShell)authShell.hidden=false; /* "Starting…" until the module decides */
  setTimeout(window.__habitusLocalFallback,window.__HABITUS_BOOT_WAIT_MS||6000);
})();
</script>
