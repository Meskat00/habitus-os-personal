<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow, noarchive"/>
<title>Habitus OS — Offline</title>
<style>
  body{background:#070914;color:#e6e9f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:1rem}
  .card{background:#0d1024;border:1px solid #232a4d;border-radius:16px;padding:2rem;max-width:380px;text-align:center}
  .mark{width:56px;height:56px;border-radius:14px;margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;
    font-size:1.8rem;font-weight:800;color:#fff;background:linear-gradient(135deg,#7c3aed,#22d3ee)}
  h1{font-size:1.2rem;margin:0 0 .5rem}
  p{color:#9aa3c7;font-size:.9rem;line-height:1.5}
  button{background:#7c3aed;color:#fff;border:none;border-radius:10px;padding:.7rem 1.4rem;font-size:.95rem;cursor:pointer;margin-top:1rem}
</style>
</head>
<body>
<div class="card">
  <div class="mark">H</div>
  <h1>You're offline</h1>
  <p>Habitus OS needs a connection the first time it loads. If you've opened it before on this device, your installed copy should start normally — try reopening the app.</p>
  <button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
